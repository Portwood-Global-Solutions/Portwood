<template>
    <div class="admin-workspace" onannounce={handleA11yAnnounce}>
        <!-- Page-level ARIA live region. Children dispatch a bubbling
             CustomEvent('announce', {detail:{message:'…'}, composed:true}) and
             we mirror the message text here so screen readers announce it. -->
        <div aria-live="polite" aria-atomic="true" class="slds-assistive-text">{liveAnnouncement}</div>
        <lightning-tabset variant="scoped" active-tab-value={activeMainTab}>
            <lightning-tab label="Create New" value="new_template" onactive={handleWizardTabActive}>
                <div class="slds-var-p-around_large">
                    <div class="wizard-header">
                        <lightning-progress-indicator current-step={wizardProgressStep} type="base" variant="base">
                            <lightning-progress-step label="Name Your Template" value="1"></lightning-progress-step>
                            <lightning-progress-step label="Pick Your Data" value="2"></lightning-progress-step>
                            <lightning-progress-step label="Review &amp; Create" value="3"></lightning-progress-step>
                        </lightning-progress-indicator>
                    </div>

                    <div class="wizard-content">
                        <!-- Step 1: Details + Data Source Selection -->
                        <template if:true={isStep1}>
                            <!-- #236 — a partially-upgraded org is missing restricted
                                 Type__c picklist values, which makes every create fail
                                 with an opaque UI API error. Say so up front. -->
                            <template if:true={hasMissingTypeValues}>
                                <div
                                    class="slds-box slds-box_x-small slds-theme_warning slds-var-m-bottom_medium"
                                    role="alert"
                                >
                                    <p class="slds-text-body_small">
                                        <lightning-icon
                                            icon-name="utility:warning"
                                            size="x-small"
                                            class="slds-var-m-right_x-small"
                                        ></lightning-icon>
                                        {missingTypeValuesMessage}
                                    </p>
                                </div>
                            </template>
                            <!-- HTML-first authoring path picker -->
                            <div
                                class="dg-authoring-cards slds-var-m-bottom_large"
                                role="radiogroup"
                                aria-label="How do you want to build this template?"
                            >
                                <template for:each={authoringCards} for:item="card">
                                    <div
                                        key={card.mode}
                                        class={card.cardClass}
                                        data-mode={card.mode}
                                        onclick={handleAuthoringModeSelect}
                                        onkeydown={handleAuthoringModeKeydown}
                                        role="radio"
                                        aria-checked={card.selected}
                                        tabindex="0"
                                    >
                                        <div class="dg-authoring-card-head">
                                            <lightning-icon icon-name={card.icon} size="small"></lightning-icon>
                                            <span class="dg-authoring-card-title">{card.title}</span>
                                            <template if:true={card.badge}>
                                                <span class="dg-authoring-badge">{card.badge}</span>
                                            </template>
                                        </div>
                                        <p class="dg-authoring-card-desc">{card.desc}</p>
                                    </div>
                                </template>
                            </div>
                            <div class="slds-grid slds-gutters_large">
                                <div class="slds-col slds-size_1-of-2">
                                    <lightning-input
                                        label="Template Name"
                                        value={newTemplateName}
                                        onchange={handleNameChange}
                                        required
                                    ></lightning-input>
                                    <!-- Starter/AI paths keep Step 1 minimal: name, object,
                                         logo. Power-user fields live behind Advanced. -->
                                    <template if:true={showStep1AdvancedFields}>
                                        <lightning-input
                                            label="API Name"
                                            value={newTemplateApiName}
                                            onchange={handleNewApiNameChange}
                                            max-length="80"
                                            pattern="[a-zA-Z][a-zA-Z0-9_]*"
                                            message-when-pattern-mismatch="Letters, numbers, and underscores only; must start with a letter."
                                            field-level-help="Stable key for referencing this template from Flows and Portwood Buttons (Template API Name input). Auto-fills from the name; survives sandbox-to-production deploys, unlike the record Id. Must be unique. Clear it to re-sync with the name."
                                            class="slds-var-m-top_medium"
                                        ></lightning-input>
                                        <lightning-input
                                            label="Category"
                                            value={newTemplateCategory}
                                            onchange={handleCategoryChange}
                                            class="slds-var-m-top_medium"
                                        ></lightning-input>

                                        <!-- Data Source: Salesforce Record vs Apex Class -->
                                        <lightning-radio-group
                                            class="slds-var-m-top_medium"
                                            label="Data Source"
                                            name="dataSourceMode"
                                            options={dataSourceModeOptions}
                                            value={dataSourceMode}
                                            onchange={handleDataSourceModeChange}
                                            type="radio"
                                            required
                                        >
                                        </lightning-radio-group>
                                    </template>

                                    <!-- Salesforce Record path: Base Object picker.
                                         Hidden for predesigned starters — each starter
                                         brings its own object and query. -->
                                    <template if:true={showBaseObjectField}>
                                        <div style="position: relative" class="slds-var-m-top_medium">
                                            <lightning-input
                                                label="Base Object"
                                                value={newTemplateObject}
                                                onchange={handleObjectSearchInput}
                                                placeholder="Account, Opportunity, Contact..."
                                                required
                                                autocomplete="off"
                                            >
                                            </lightning-input>
                                            <template if:true={showObjectSuggestions}>
                                                <ul role="listbox" class="slds-is-absolute dg-suggestion-dropdown">
                                                    <template for:each={filteredObjectOptions} for:item="obj">
                                                        <li
                                                            key={obj.value}
                                                            class="slash-item"
                                                            role="option"
                                                            style="
                                                                cursor: pointer;
                                                                padding: 8px 12px;
                                                                display: flex;
                                                                align-items: center;
                                                                gap: 8px;
                                                                border-bottom: 1px solid #f3f2f2;
                                                            "
                                                            data-value={obj.value}
                                                            onclick={handleObjectSuggestionClick}
                                                        >
                                                            <span style="font-weight: 600">{obj.label}</span>
                                                            <span
                                                                style="
                                                                    font-family: monospace;
                                                                    font-size: 0.8rem;
                                                                    color: #7c3aed;
                                                                "
                                                                >{obj.value}</span
                                                            >
                                                            <template if:true={obj.isStandard}>
                                                                <span
                                                                    style="
                                                                        margin-left: auto;
                                                                        font-size: 0.7rem;
                                                                        font-weight: 600;
                                                                        color: #fff;
                                                                        background: #16a085;
                                                                        padding: 2px 8px;
                                                                        border-radius: 10px;
                                                                        white-space: nowrap;
                                                                    "
                                                                    >Standard</span
                                                                >
                                                            </template>
                                                        </li>
                                                    </template>
                                                </ul>
                                            </template>
                                        </div>
                                    </template>

                                    <!-- JSON Data (from Flow) path: nothing to configure here.
                                         The template receives its data at runtime from a Flow that
                                         supplies DocGenFlowAction.jsonData — no Base Object, no SOQL,
                                         no merge-field picker required. -->
                                    <template if:true={isFlowDataSource}>
                                        <div
                                            class="slds-box slds-theme_default slds-var-m-top_medium"
                                            style="border-radius: 8px"
                                        >
                                            <p class="slds-text-body_small">
                                                <lightning-icon
                                                    icon-name="utility:flow"
                                                    size="x-small"
                                                    class="slds-var-m-right_x-small"
                                                ></lightning-icon>
                                                This template receives its data from a Flow at runtime via
                                                <code>DocGenFlowAction.jsonData</code>. No Base Object or SOQL config
                                                needed — build the JSON payload in your Flow before invoking Generate
                                                Document. Next step: upload the template document.
                                            </p>
                                        </div>
                                    </template>

                                    <!-- Apex Data Provider path: class picker right here on Step 1 -->
                                    <template if:true={isApexDataSource}>
                                        <div class="slds-var-m-top_medium">
                                            <template if:false={isProviderConnected}>
                                                <div style="position: relative">
                                                    <lightning-input
                                                        type="search"
                                                        label="Data Provider Class"
                                                        placeholder="Search Apex classes implementing DocGenDataProvider..."
                                                        value={providerSearchTerm}
                                                        onchange={handleApexProviderSearch}
                                                        required
                                                    >
                                                    </lightning-input>
                                                    <template if:true={showProviderPicker}>
                                                        <div
                                                            class="slds-dropdown slds-dropdown_length-5 slds-dropdown_fluid slds-is-absolute dg-provider-dropdown"
                                                        >
                                                            <ul class="slds-listbox slds-listbox_vertical">
                                                                <template if:true={providerOptions.length}>
                                                                    <template for:each={providerOptions} for:item="cls">
                                                                        <li key={cls} class="slds-listbox__item">
                                                                            <div
                                                                                class="slds-media slds-listbox__option slds-listbox__option_plain slds-media_small"
                                                                                data-value={cls}
                                                                                onclick={handleApexProviderSelect}
                                                                            >
                                                                                <span class="slds-truncate"
                                                                                    ><lightning-icon
                                                                                        icon-name="utility:apex"
                                                                                        size="x-small"
                                                                                        class="slds-var-m-right_x-small"
                                                                                    ></lightning-icon
                                                                                    >{cls}</span
                                                                                >
                                                                            </div>
                                                                        </li>
                                                                    </template>
                                                                </template>
                                                                <template if:false={providerOptions.length}>
                                                                    <li class="slds-listbox__item">
                                                                        <div
                                                                            class="slds-media slds-listbox__option slds-listbox__option_plain slds-media_small"
                                                                        >
                                                                            <span class="slds-text-color_weak"
                                                                                >No classes implementing
                                                                                DocGenDataProvider found</span
                                                                            >
                                                                        </div>
                                                                    </li>
                                                                </template>
                                                            </ul>
                                                        </div>
                                                    </template>
                                                </div>
                                                <p
                                                    class="slds-text-body_small slds-text-color_weak slds-var-m-top_x-small"
                                                >
                                                    Implement <code>portwoodglobal.DocGenDataProvider</code> in your
                                                    org's Apex code to supply merge data from any source (callouts,
                                                    computed values, cross-object aggregations).
                                                </p>
                                                <template if:true={isValidatingProvider}>
                                                    <div
                                                        class="slds-var-m-top_small slds-is-relative"
                                                        style="height: 30px"
                                                    >
                                                        <lightning-spinner
                                                            alternative-text="Validating..."
                                                            size="small"
                                                        ></lightning-spinner>
                                                    </div>
                                                </template>
                                            </template>
                                            <template if:true={isProviderConnected}>
                                                <div class="slds-box slds-theme_default" style="border-radius: 8px">
                                                    <div
                                                        style="
                                                            display: flex;
                                                            align-items: center;
                                                            justify-content: space-between;
                                                        "
                                                    >
                                                        <div style="display: flex; align-items: center; gap: 8px">
                                                            <lightning-icon
                                                                icon-name="utility:apex"
                                                                size="x-small"
                                                            ></lightning-icon>
                                                            <span style="font-weight: 700"
                                                                >{selectedProviderClassName}</span
                                                            >
                                                            <span class="slds-badge slds-badge_lightest"
                                                                >{providerFields.length} fields</span
                                                            >
                                                        </div>
                                                        <lightning-button
                                                            label="Change class"
                                                            variant="base"
                                                            icon-name="utility:close"
                                                            onclick={handleClearApexProvider}
                                                        >
                                                        </lightning-button>
                                                    </div>
                                                    <div class="slds-var-m-top_small">
                                                        <lightning-input
                                                            label="Base Object (optional)"
                                                            value={apexProviderBaseObject}
                                                            onchange={handleApexProviderBaseObjectChange}
                                                            placeholder="Account, Opportunity, Custom_Object__c"
                                                            field-level-help="Leave blank for record-agnostic providers. Set an SObject API name when this provider returns data about a specific record type — needed for cross-object aggregation and record-context filtering."
                                                            autocomplete="off"
                                                        >
                                                        </lightning-input>
                                                    </div>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                    <template if:true={showAdvancedToggle}>
                                        <div class="slds-var-m-top_medium">
                                            <lightning-button
                                                variant="base"
                                                label={advancedToggleLabel}
                                                icon-name="utility:settings"
                                                onclick={handleToggleAdvanced}
                                            ></lightning-button>
                                        </div>
                                    </template>
                                </div>
                                <div class="slds-col slds-size_1-of-2">
                                    <!-- Starter path: design gallery -->
                                    <template if:true={isAuthoringStarter}>
                                        <label class="slds-form-element__label">Starter Design</label>
                                        <div role="radiogroup" aria-label="Starter design">
                                            <template for:each={starterCards} for:item="starter">
                                                <div
                                                    key={starter.key}
                                                    class={starter.cardClass}
                                                    data-key={starter.key}
                                                    onclick={handleStarterSelect}
                                                    role="radio"
                                                    aria-checked={starter.selected}
                                                    tabindex="0"
                                                >
                                                    <div class="dg-starter-card-head">
                                                        <lightning-icon
                                                            icon-name={starter.icon}
                                                            size="x-small"
                                                        ></lightning-icon>
                                                        <span class="dg-starter-card-title">{starter.label}</span>
                                                        <span class="dg-starter-card-obj">{starter.targetObject}</span>
                                                    </div>
                                                    <p class="dg-starter-card-desc">{starter.description}</p>
                                                </div>
                                            </template>
                                        </div>
                                        <div class="slds-var-m-top_small">
                                            <lightning-combobox
                                                label="Company logo (optional)"
                                                value={newTemplateLogoChoice}
                                                options={logoChoiceOptions}
                                                onchange={handleLogoChoiceChange}
                                                field-level-help="Pick a shared image asset — the starter header carries its merge tag. Add new images under the Assets tab."
                                            ></lightning-combobox>
                                            <template if:true={selectedLogoPreviewUrl}>
                                                <img
                                                    class="dg-logo-preview"
                                                    src={selectedLogoPreviewUrl}
                                                    alt="Selected logo preview"
                                                />
                                            </template>
                                            <template if:true={hasNoAssetsYet}>
                                                <p class="slds-text-body_small slds-text-color_weak">
                                                    No image assets yet — add your logo under the
                                                    <strong>Assets</strong> tab and it becomes selectable here.
                                                </p>
                                            </template>
                                        </div>
                                        <template if:true={isRecordDataSource}>
                                            <template if:true={newTemplateObject}>
                                                <div class="slds-var-m-top_small">
                                                    <lightning-record-picker
                                                        label="Sample Record (optional)"
                                                        object-api-name={newTemplateObject}
                                                        value={newTemplateSampleRecordId}
                                                        onchange={handleSampleRecordChange}
                                                        placeholder="Pick a record to preview with real data..."
                                                    >
                                                    </lightning-record-picker>
                                                </div>
                                            </template>
                                        </template>
                                        <div class="slds-var-m-top_medium">
                                            <lightning-button
                                                variant="brand"
                                                label="Create &amp; Open Designer"
                                                icon-name="utility:magicwand"
                                                onclick={handleCreateAndDesign}
                                                disabled={isAutoCreating}
                                            ></lightning-button>
                                            <template if:true={isAutoCreating}>
                                                <lightning-spinner
                                                    alternative-text="Creating..."
                                                    size="small"
                                                    class="slds-var-m-left_small"
                                                ></lightning-spinner>
                                            </template>
                                            <p class="slds-text-body_small slds-text-color_weak slds-var-m-top_x-small">
                                                One click: we pick sensible fields for your object automatically, build
                                                the document, and open it in the designer. Refine fields anytime under
                                                Query Configuration.
                                            </p>
                                        </div>
                                    </template>

                                    <!-- AI path: name here; fields, assets, prompt and paste on the next screen -->
                                    <template if:true={isAuthoringAi}>
                                        <div class="slds-box slds-theme_shade" style="border-radius: 8px" role="note">
                                            <p class="slds-text-body_small">
                                                <lightning-icon
                                                    icon-name="utility:einstein"
                                                    size="x-small"
                                                    class="slds-var-m-right_x-small"
                                                ></lightning-icon>
                                                Next builds a complete prompt for you — pick your fields and the shared
                                                images it should use, copy it into Claude, ChatGPT, Gemini, or Copilot,
                                                paste the HTML it returns, and you land in the designer. No data leaves
                                                Salesforce unless you paste it.
                                            </p>
                                        </div>
                                        <div class="slds-var-m-top_medium">
                                            <lightning-button
                                                variant="brand"
                                                label="Next: Build My Prompt"
                                                icon-name="utility:einstein"
                                                onclick={handleNextStep}
                                                disabled={isAutoCreating}
                                            ></lightning-button>
                                            <template if:true={isAutoCreating}>
                                                <lightning-spinner
                                                    alternative-text="Preparing prompt..."
                                                    size="small"
                                                    class="slds-var-m-left_small"
                                                ></lightning-spinner>
                                            </template>
                                            <p class="slds-text-body_small slds-text-color_weak slds-var-m-top_x-small">
                                                Sensible fields are picked automatically — refine them on the next
                                                screen.
                                            </p>
                                        </div>
                                    </template>

                                    <!-- Scratch path: straight to a blank designer page -->
                                    <template if:true={isAuthoringScratch}>
                                        <div class="slds-box slds-theme_shade" style="border-radius: 8px" role="note">
                                            <p class="slds-text-body_small">
                                                <lightning-icon
                                                    icon-name="utility:edit"
                                                    size="x-small"
                                                    class="slds-var-m-right_x-small"
                                                ></lightning-icon>
                                                You get a clean page in the visual designer. Click anywhere and type,
                                                drag in blocks and merge tags, or press&nbsp;<code>&#96;</code>&nbsp;for
                                                the insert menu. All of your object's usable fields and its main child
                                                lists are queried automatically, so the whole tag palette is ready to
                                                drop in — fine-tune anytime under Query Configuration.
                                            </p>
                                        </div>
                                        <template if:true={isRecordDataSource}>
                                            <template if:true={newTemplateObject}>
                                                <div class="slds-var-m-top_small">
                                                    <lightning-record-picker
                                                        label="Sample Record (optional)"
                                                        object-api-name={newTemplateObject}
                                                        value={newTemplateSampleRecordId}
                                                        onchange={handleSampleRecordChange}
                                                        placeholder="Pick a record to preview with real data..."
                                                    >
                                                    </lightning-record-picker>
                                                </div>
                                            </template>
                                        </template>
                                        <div class="slds-var-m-top_medium">
                                            <lightning-button
                                                variant="brand"
                                                label="Create &amp; Open Designer"
                                                icon-name="utility:edit"
                                                onclick={handleCreateAndDesign}
                                                disabled={isAutoCreating}
                                            ></lightning-button>
                                            <template if:true={isAutoCreating}>
                                                <lightning-spinner
                                                    alternative-text="Creating..."
                                                    size="small"
                                                    class="slds-var-m-left_small"
                                                ></lightning-spinner>
                                            </template>
                                        </div>
                                    </template>

                                    <!-- Canvas path: straight to the artboard -->
                                    <template if:true={isAuthoringCanvas}>
                                        <div class="slds-box slds-theme_shade" style="border-radius: 8px" role="note">
                                            <p class="slds-text-body_small">
                                                <lightning-icon
                                                    icon-name="utility:layout"
                                                    size="x-small"
                                                    class="slds-var-m-right_x-small"
                                                ></lightning-icon>
                                                You get a blank artboard at true page size. Drop boxes exactly where you
                                                want them and they land there in the PDF, to the inch. A box can be
                                                <b>pinned</b> — it stays put — or set to <b>flow</b>, so a line-item
                                                loop can grow and spill onto as many pages as the data needs. Add more
                                                pages from the left rail.
                                            </p>
                                        </div>
                                        <template if:true={isRecordDataSource}>
                                            <template if:true={newTemplateObject}>
                                                <div class="slds-var-m-top_small">
                                                    <lightning-record-picker
                                                        label="Sample Record (optional)"
                                                        object-api-name={newTemplateObject}
                                                        value={newTemplateSampleRecordId}
                                                        onchange={handleSampleRecordChange}
                                                        placeholder="Pick a record to preview with real data..."
                                                    >
                                                    </lightning-record-picker>
                                                </div>
                                            </template>
                                        </template>
                                        <div class="slds-var-m-top_medium">
                                            <lightning-button
                                                variant="brand"
                                                label="Create &amp; Open Canvas"
                                                icon-name="utility:layout"
                                                onclick={handleCreateAndDesign}
                                                disabled={isAutoCreating}
                                            ></lightning-button>
                                            <template if:true={isAutoCreating}>
                                                <lightning-spinner
                                                    alternative-text="Creating..."
                                                    size="small"
                                                    class="slds-var-m-left_small"
                                                ></lightning-spinner>
                                            </template>
                                        </div>
                                    </template>

                                    <!-- File path: classic Type/Output Format pickers -->
                                    <template if:true={isAuthoringFile}>
                                        <lightning-combobox
                                            label="Type"
                                            value={newTemplateType}
                                            options={typeOptions}
                                            onchange={handleTypeChange}
                                            field-level-help="What kind of source file you'll upload. HTML is the most reliable for PDF output; Word/PowerPoint/Excel keep their native format or convert to PDF."
                                            required
                                        ></lightning-combobox>
                                        <template if:true={showWordConversionNote}>
                                            <div
                                                class="slds-box slds-box_x-small slds-theme_warning slds-var-m-top_x-small"
                                                role="note"
                                            >
                                                <p class="slds-text-body_small">
                                                    <lightning-icon
                                                        icon-name="utility:info"
                                                        size="x-small"
                                                        class="slds-var-m-right_x-small"
                                                    ></lightning-icon>
                                                    A Word template stays a Word file. Choosing Output
                                                    Format&nbsp;<strong>Native (.docx)</strong>&nbsp;generates the
                                                    document with full fidelity.
                                                    Choosing&nbsp;<strong>PDF</strong>&nbsp;converts it to HTML first,
                                                    and complex layouts (text boxes, floating images, unusual tables)
                                                    may not convert exactly. If you need a pixel-perfect PDF, build it
                                                    on&nbsp;<strong>a Blank Canvas</strong>&nbsp;instead, where what you
                                                    place is what prints.
                                                    <strong>Excel</strong
                                                    >&nbsp;and&nbsp;<strong>PowerPoint</strong>&nbsp;always generate in
                                                    their native format — no conversion involved.
                                                </p>
                                            </div>
                                        </template>
                                        <lightning-combobox
                                            label="Output Format"
                                            value={newTemplateOutputFormat}
                                            options={outputFormatOptions}
                                            onchange={handleOutputFormatChange}
                                            class="slds-var-m-top_medium"
                                            required
                                        ></lightning-combobox>
                                    </template>
                                    <template if:true={showNewPageLayoutFields}>
                                        <lightning-combobox
                                            label="Page Orientation"
                                            value={newTemplatePageOrientation}
                                            options={pageOrientationOptions}
                                            onchange={handleNewPageOrientationChange}
                                            class="slds-var-m-top_medium"
                                            field-level-help="Portrait or Landscape — applies to PDF output."
                                        ></lightning-combobox>
                                        <lightning-combobox
                                            label="Page Size"
                                            value={newTemplatePageSize}
                                            options={pageSizeOptions}
                                            onchange={handleNewPageSizeChange}
                                            class="slds-var-m-top_medium"
                                            field-level-help="Letter (US default), Legal, or A4 (international)."
                                        ></lightning-combobox>
                                        <lightning-combobox
                                            label="Page Margins"
                                            value={newTemplatePageMargins}
                                            options={pageMarginsOptions}
                                            onchange={handleNewPageMarginsChange}
                                            class="slds-var-m-top_medium"
                                            field-level-help="Default uses 1in portrait / 0.5in landscape. Pick a preset or Custom."
                                        ></lightning-combobox>
                                        <template if:true={showNewCustomMargins}>
                                            <lightning-input
                                                label="Custom Margins (in)"
                                                value={newTemplateCustomMargins}
                                                onchange={handleNewCustomMarginsChange}
                                                class="slds-var-m-top_medium"
                                                placeholder="0.75 or 0.5,0.75,0.5,0.75"
                                                field-level-help="One value applies to all sides; four values are Top,Right,Bottom,Left in inches. Range 0.1–3.0."
                                            ></lightning-input>
                                        </template>
                                    </template>
                                    <template if:true={showCanvasPageNote}>
                                        <div class="slds-box slds-theme_shade slds-var-m-top_medium" role="status">
                                            <p class="slds-text-body_small">
                                                <lightning-icon
                                                    icon-name="utility:info"
                                                    size="x-small"
                                                    class="slds-var-m-right_x-small"
                                                ></lightning-icon>
                                                Page size, orientation and margins are set on the canvas itself, under
                                                <b>Page</b> in the toolbar. A new canvas starts Letter, portrait, with
                                                no margins — so what you place is exactly where it prints.
                                            </p>
                                        </div>
                                    </template>
                                    <template if:true={showHtmlPageRuleNote}>
                                        <div class="slds-box slds-theme_shade slds-var-m-top_medium" role="status">
                                            <p class="slds-text-body_small">
                                                <lightning-icon
                                                    icon-name="utility:info"
                                                    size="x-small"
                                                    class="slds-var-m-right_x-small"
                                                ></lightning-icon>
                                                Page layout for HTML templates comes from your
                                                <code>@page</code> CSS rule. Upload your HTML in the next step — if it
                                                doesn't declare <code>@page</code>, you can set Letter/A4/Margins in the
                                                template editor.
                                            </p>
                                        </div>
                                    </template>
                                    <template if:true={isAuthoringFile}>
                                        <template if:true={isRecordDataSource}>
                                            <template if:true={newTemplateObject}>
                                                <div class="slds-var-m-top_medium">
                                                    <lightning-record-picker
                                                        label="Sample Record (optional)"
                                                        object-api-name={newTemplateObject}
                                                        value={newTemplateSampleRecordId}
                                                        onchange={handleSampleRecordChange}
                                                        placeholder="Pick a record to preview data..."
                                                    >
                                                    </lightning-record-picker>
                                                    <p
                                                        class="slds-text-body_small slds-text-color_weak slds-var-m-top_xx-small"
                                                    >
                                                        See real data from this record while building your query.
                                                    </p>
                                                </div>
                                            </template>
                                        </template>
                                    </template>
                                    <template if:true={isApexDataSource}>
                                        <div
                                            class="slds-var-m-top_medium slds-text-body_small slds-text-color_weak"
                                            style="font-style: italic"
                                        >
                                            Sample records aren't applicable for Apex Data Providers — the class
                                            supplies its own data shape at render time.
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </template>

                        <!-- AI step: prompt → paste → designer, all on one screen -->
                        <template if:true={isStepAi}>
                            <div class="slds-grid slds-gutters_large slds-wrap">
                                <div class="slds-col slds-size_1-of-1">
                                    <div class="dg-ai-step-head">
                                        <span class="dg-ai-step-num">1</span>
                                        <strong>Pick your fields ({aiQueryFieldCount})</strong>
                                    </div>
                                    <p class="slds-text-body_small slds-text-color_weak slds-var-m-bottom_xx-small">
                                        These become the merge tags the AI is allowed to use — the prompt updates as you
                                        tick.
                                    </p>
                                    <div class="slds-var-m-bottom_small">
                                        <c-doc-gen-tree-builder
                                            selected-object={newTemplateObject}
                                            query-config={newTemplateQuery}
                                            onconfigchange={handleConfigChange}
                                        >
                                        </c-doc-gen-tree-builder>
                                    </div>
                                    <div class="dg-ai-step-head slds-var-m-top_small">
                                        <span class="dg-ai-step-num">2</span>
                                        <strong>Pick your images</strong>
                                    </div>
                                    <p class="slds-text-body_small slds-text-color_weak slds-var-m-bottom_xx-small">
                                        Tick the shared assets this document should use — the prompt tells the AI how to
                                        place each one.
                                    </p>
                                    <template if:true={hasWizardAssets}>
                                        <div class="dg-ai-assetlist">
                                            <template for:each={aiAssetRows} for:item="asset">
                                                <label key={asset.id} class="dg-qf-row">
                                                    <input
                                                        type="checkbox"
                                                        checked={asset.selected}
                                                        data-id={asset.id}
                                                        onchange={handleAiAssetToggle}
                                                    />
                                                    <template if:true={asset.previewUrl}>
                                                        <img
                                                            class="dg-ai-asset-thumb"
                                                            src={asset.previewUrl}
                                                            alt={asset.name}
                                                        />
                                                    </template>
                                                    <span class="dg-qf-label">{asset.name}</span>
                                                    <span class="dg-qf-api">{asset.mergeTag}</span>
                                                </label>
                                            </template>
                                        </div>
                                    </template>
                                    <template if:false={hasWizardAssets}>
                                        <p class="slds-text-body_small slds-text-color_weak">
                                            No image assets yet — add them under the <strong>Assets</strong> tab and
                                            they become selectable here.
                                        </p>
                                    </template>
                                    <div class="dg-ai-step-head slds-var-m-top_small">
                                        <span class="dg-ai-step-num">3</span>
                                        <strong>Describe your document</strong>
                                    </div>
                                    <p class="slds-text-body_small slds-text-color_weak slds-var-m-bottom_xx-small">
                                        In your own words — purpose, sections, tone, brand colors. This goes straight
                                        into the prompt.
                                    </p>
                                    <textarea
                                        class="dg-hf-ta dg-ai-desc"
                                        spellcheck="true"
                                        placeholder="e.g. A two-page account summary: header with our logo, key details table, open opportunities with a total row, navy and gray branding."
                                        oninput={handleAiDescChange}
                                    ></textarea>
                                </div>
                                <div class="slds-col slds-size_1-of-1">
                                    <div class="dg-ai-step-head">
                                        <span class="dg-ai-step-num">4</span>
                                        <strong>Copy your prompt</strong>
                                        <lightning-button
                                            label="Copy Prompt"
                                            icon-name="utility:copy"
                                            variant="brand"
                                            onclick={handleCopyAiPrompt}
                                            class="slds-var-m-left_small"
                                        ></lightning-button>
                                    </div>
                                    <p class="slds-text-body_small slds-text-color_weak slds-var-m-bottom_x-small">
                                        Paste it into Claude, ChatGPT, Gemini, or Copilot. It carries your fields,
                                        images, description, and the PDF engine's layout rules.
                                    </p>
                                    <pre class="dg-ai-prompt">{aiAuthoringPrompt}</pre>

                                    <template if:true={showWizardAgentforce}>
                                        <div class="slds-box slds-var-m-top_small slds-var-m-bottom_small">
                                            <div
                                                class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center"
                                            >
                                                <div>
                                                    <strong>Or skip the copy-paste</strong>
                                                    <p class="slds-text-body_small slds-text-color_weak">
                                                        Send that exact prompt to Salesforce AI in this org. The result
                                                        is checked against the PDF engine's rules and dropped straight
                                                        into the box below.
                                                    </p>
                                                </div>
                                                <lightning-button
                                                    label={wizardAgentforceBtnLabel}
                                                    variant="brand"
                                                    icon-name="utility:einstein"
                                                    onclick={handleWizardAgentforceGenerate}
                                                    disabled={isWizardAgentforceGenerating}
                                                ></lightning-button>
                                            </div>
                                            <template if:true={isWizardAgentforceGenerating}>
                                                <div
                                                    class="slds-is-relative slds-var-m-top_medium"
                                                    style="height: 44px"
                                                >
                                                    <lightning-spinner
                                                        alternative-text="Generating..."
                                                        size="small"
                                                    ></lightning-spinner>
                                                </div>
                                            </template>
                                            <template if:true={hasWizardAgentforceReport}>
                                                <div class="slds-var-m-top_medium">
                                                    <h3 class="slds-text-heading_small slds-var-m-bottom_x-small">
                                                        {wizardAgentforceSummary}
                                                    </h3>
                                                    <template for:each={wizardAgentforceFindings} for:item="f">
                                                        <div key={f.key} class="slds-var-m-bottom_x-small">
                                                            <lightning-badge
                                                                label={f.badge}
                                                                class={f.badgeClass}
                                                            ></lightning-badge>
                                                            <strong class="slds-var-m-left_x-small">{f.rule}</strong>
                                                            <span class="slds-text-body_small slds-text-color_weak">
                                                                &times;{f.occurrences}</span
                                                            >
                                                            <p class="slds-text-body_small slds-var-m-left_medium">
                                                                {f.detail}
                                                            </p>
                                                        </div>
                                                    </template>
                                                </div>
                                            </template>
                                        </div>
                                    </template>

                                    <div class="dg-ai-step-head slds-var-m-top_small">
                                        <span class="dg-ai-step-num">5</span>
                                        <strong>Paste the HTML it returns</strong>
                                    </div>
                                    <textarea
                                        class="dg-ai-paste"
                                        placeholder="Paste the complete HTML file your AI assistant returned (starts with <!DOCTYPE html>)..."
                                        onchange={handleAiPasteChange}
                                        spellcheck="false"
                                    ></textarea>
                                    <div class="dg-ai-step-head slds-var-m-top_small">
                                        <span class="dg-ai-step-num">6</span>
                                        <strong>Sample record (optional)</strong>
                                    </div>
                                    <template if:true={isRecordDataSource}>
                                        <template if:true={newTemplateObject}>
                                            <lightning-record-picker
                                                label="Sample Record"
                                                variant="label-hidden"
                                                object-api-name={newTemplateObject}
                                                value={newTemplateSampleRecordId}
                                                onchange={handleSampleRecordChange}
                                                placeholder="Pick a record to preview with real data..."
                                            >
                                            </lightning-record-picker>
                                        </template>
                                    </template>
                                    <div class="slds-var-m-top_small">
                                        <lightning-button
                                            variant="brand"
                                            label="Create &amp; Open Designer"
                                            icon-name="utility:magicwand"
                                            onclick={handleAiCreateFromPaste}
                                            disabled={isAutoCreating}
                                        ></lightning-button>
                                        <template if:true={isAutoCreating}>
                                            <lightning-spinner
                                                alternative-text="Creating..."
                                                size="small"
                                                class="slds-var-m-left_small"
                                            ></lightning-spinner>
                                        </template>
                                        <p class="slds-text-body_small slds-text-color_weak slds-var-m-top_x-small">
                                            Pasted HTML is staged as the template body and opens in the visual designer.
                                            Nothing pasted yet? The designer opens empty and the prompt stays available
                                            there.
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </template>

                        <!-- Step 2: Query -->
                        <template if:true={isStep2}>
                            <div
                                style="
                                    margin-bottom: 12px;
                                    display: flex;
                                    align-items: center;
                                    justify-content: space-between;
                                "
                            >
                                <div style="display: flex; align-items: center; gap: 8px">
                                    <lightning-icon icon-name="standard:account" size="x-small"></lightning-icon>
                                    <span style="font-weight: 700">{newTemplateObject}</span>
                                </div>
                                <div style="display: flex; align-items: center; gap: 16px">
                                    <template if:false={useApexProvider}>
                                        <a
                                            href="javascript:void(0)"
                                            onclick={toggleVisualBuilder}
                                            style="
                                                font-size: 0.82rem;
                                                color: #7c3aed;
                                                text-decoration: none;
                                                display: flex;
                                                align-items: center;
                                                gap: 4px;
                                            "
                                        >
                                            <lightning-icon
                                                icon-name={visualBuilderToggleIcon}
                                                size="xx-small"
                                                style="--sds-c-icon-color-foreground-default: #7c3aed"
                                            ></lightning-icon>
                                            <template if:false={useVisualBuilder}>Try our visual builder</template>
                                            <template if:true={useVisualBuilder}>Switch to manual query</template>
                                        </a>
                                    </template>
                                    <a
                                        href="javascript:void(0)"
                                        onclick={toggleApexProvider}
                                        style="
                                            font-size: 0.82rem;
                                            color: #7c3aed;
                                            text-decoration: none;
                                            display: flex;
                                            align-items: center;
                                            gap: 4px;
                                        "
                                    >
                                        <lightning-icon
                                            icon-name="utility:apex"
                                            size="xx-small"
                                            style="--sds-c-icon-color-foreground-default: #7c3aed"
                                        ></lightning-icon>
                                        {apexProviderToggleLabel}
                                    </a>
                                </div>
                            </div>

                            <!-- Apex Data Provider mode (V4) -->
                            <template if:true={useApexProvider}>
                                <div class="slds-box slds-theme_default" style="border-radius: 8px">
                                    <p class="slds-text-body_small slds-text-color_weak slds-var-m-bottom_small">
                                        Bind this template to an Apex class implementing
                                        <code>portwoodglobal.DocGenDataProvider</code>. The class supplies merge data at
                                        render time — no SOQL config needed.
                                    </p>
                                    <template if:false={isProviderConnected}>
                                        <div style="position: relative">
                                            <lightning-input
                                                type="search"
                                                label="Search for a Data Provider class"
                                                placeholder="Type at least 2 characters..."
                                                value={providerSearchTerm}
                                                onchange={handleApexProviderSearch}
                                            >
                                            </lightning-input>
                                            <template if:true={showProviderPicker}>
                                                <div
                                                    class="slds-dropdown slds-dropdown_length-5 slds-dropdown_fluid slds-is-absolute dg-provider-dropdown"
                                                >
                                                    <ul class="slds-listbox slds-listbox_vertical">
                                                        <template if:true={providerOptions.length}>
                                                            <template for:each={providerOptions} for:item="cls">
                                                                <li key={cls} class="slds-listbox__item">
                                                                    <div
                                                                        class="slds-media slds-listbox__option slds-listbox__option_plain slds-media_small"
                                                                        data-value={cls}
                                                                        onclick={handleApexProviderSelect}
                                                                    >
                                                                        <span class="slds-truncate"
                                                                            ><lightning-icon
                                                                                icon-name="utility:apex"
                                                                                size="x-small"
                                                                                class="slds-var-m-right_x-small"
                                                                            ></lightning-icon
                                                                            >{cls}</span
                                                                        >
                                                                    </div>
                                                                </li>
                                                            </template>
                                                        </template>
                                                        <template if:false={providerOptions.length}>
                                                            <li class="slds-listbox__item">
                                                                <div
                                                                    class="slds-media slds-listbox__option slds-listbox__option_plain slds-media_small"
                                                                >
                                                                    <span class="slds-text-color_weak"
                                                                        >No classes implementing DocGenDataProvider
                                                                        found</span
                                                                    >
                                                                </div>
                                                            </li>
                                                        </template>
                                                    </ul>
                                                </div>
                                            </template>
                                        </div>
                                        <template if:true={isValidatingProvider}>
                                            <div class="slds-var-m-top_small slds-is-relative" style="height: 30px">
                                                <lightning-spinner
                                                    alternative-text="Validating..."
                                                    size="small"
                                                ></lightning-spinner>
                                            </div>
                                        </template>
                                    </template>

                                    <template if:true={isProviderConnected}>
                                        <div
                                            style="
                                                display: flex;
                                                align-items: center;
                                                justify-content: space-between;
                                                margin-bottom: 8px;
                                            "
                                        >
                                            <div style="display: flex; align-items: center; gap: 8px">
                                                <lightning-icon
                                                    icon-name="utility:apex"
                                                    size="x-small"
                                                ></lightning-icon>
                                                <span style="font-weight: 700">{selectedProviderClassName}</span>
                                                <span class="slds-badge slds-badge_lightest"
                                                    >{providerFields.length} fields</span
                                                >
                                            </div>
                                            <lightning-button
                                                label="Change class"
                                                variant="base"
                                                icon-name="utility:close"
                                                onclick={handleClearApexProvider}
                                            >
                                            </lightning-button>
                                        </div>
                                        <p class="slds-text-body_small slds-text-color_weak">
                                            Available merge tags from this provider:
                                        </p>
                                        <div style="display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px">
                                            <template for:each={providerTagPills} for:item="p">
                                                <span
                                                    key={p.raw}
                                                    style="
                                                        background: #f3e8ff;
                                                        border: 1px solid #d8c4f0;
                                                        color: #7c3aed;
                                                        padding: 2px 8px;
                                                        border-radius: 4px;
                                                        font-size: 0.78rem;
                                                        font-family: monospace;
                                                    "
                                                    >{p.tag}</span
                                                >
                                            </template>
                                        </div>
                                    </template>
                                </div>
                            </template>

                            <!-- Visual Builder -->
                            <template if:true={useVisualBuilder}>
                                <c-doc-gen-tree-builder
                                    selected-object={newTemplateObject}
                                    query-config={newTemplateQuery}
                                    onconfigchange={handleConfigChange}
