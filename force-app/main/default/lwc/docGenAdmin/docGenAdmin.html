                                        onback={handleCanvasBack}
                                    ></c-doc-gen-canvas>
                                </template>
                                <template if:true={showFlowDesigner}>
                                    <div class="dg-format-bar" role="toolbar" aria-label="Text formatting">
                                        <button
                                            class={boldBtnClass}
                                            data-cmd="bold"
                                            onmousedown={handleFmtMouseDown}
                                            onclick={handleFormatAction}
                                            title="Bold"
                                        >
                                            <b>B</b>
                                        </button>
                                        <button
                                            class={italicBtnClass}
                                            data-cmd="italic"
                                            onmousedown={handleFmtMouseDown}
                                            onclick={handleFormatAction}
                                            title="Italic"
                                        >
                                            <i>I</i>
                                        </button>
                                        <button
                                            class={underlineBtnClass}
                                            data-cmd="underline"
                                            onmousedown={handleFmtMouseDown}
                                            onclick={handleFormatAction}
                                            title="Underline"
                                        >
                                            <u>U</u>
                                        </button>
                                        <button
                                            class={strikeBtnClass}
                                            data-cmd="strikeThrough"
                                            onmousedown={handleFmtMouseDown}
                                            onclick={handleFormatAction}
                                            title="Strikethrough"
                                        >
                                            <s>S</s>
                                        </button>
                                        <button
                                            class="dg-fmt-btn"
                                            data-cmd="superscript"
                                            onmousedown={handleFmtMouseDown}
                                            onclick={handleFormatAction}
                                            title="Superscript"
                                        >
                                            x&#178;
                                        </button>
                                        <button
                                            class="dg-fmt-btn"
                                            data-cmd="subscript"
                                            onmousedown={handleFmtMouseDown}
                                            onclick={handleFormatAction}
                                            title="Subscript"
                                        >
                                            x&#8322;
                                        </button>
                                        <span class="dg-fmt-sep"></span>
                                        <button
                                            class="dg-fmt-btn dg-fmt-btn_word"
                                            data-cmd="insertUnorderedList"
                                            onmousedown={handleFmtMouseDown}
                                            onclick={handleFormatAction}
                                            title="Bulleted list"
                                        >
                                            &#8226; List
                                        </button>
                                        <button
                                            class="dg-fmt-btn dg-fmt-btn_word"
                                            data-cmd="insertOrderedList"
                                            onmousedown={handleFmtMouseDown}
                                            onclick={handleFormatAction}
                                            title="Numbered list"
                                        >
                                            1. List
                                        </button>
                                        <span class="dg-fmt-sep"></span>
                                        <button
                                            class="dg-fmt-btn dg-fmt-btn_word"
                                            data-cmd="justifyLeft"
                                            onmousedown={handleFmtMouseDown}
                                            onclick={handleFormatAction}
                                            title="Align left"
                                        >
                                            Left
                                        </button>
                                        <button
                                            class="dg-fmt-btn dg-fmt-btn_word"
                                            data-cmd="justifyCenter"
                                            onmousedown={handleFmtMouseDown}
                                            onclick={handleFormatAction}
                                            title="Align center"
                                        >
                                            Center
                                        </button>
                                        <button
                                            class="dg-fmt-btn dg-fmt-btn_word"
                                            data-cmd="justifyRight"
                                            onmousedown={handleFmtMouseDown}
                                            onclick={handleFormatAction}
                                            title="Align right"

                                            Right
                                        </button>
                                        <span class="dg-fmt-sep"></span>
                                        <button
                                            class="dg-fmt-btn"
                                            data-szstep="-1"
                                            onmousedown={handleFmtMouseDown}
                                            onclick={handleFontSizeStep}
                                            title="Decrease font size"

                                            &#8722;
                                        </button>
                                        <input
                                            class="dg-fmt-size-input"
                                            type="number"
                                            min="6"
                                            max="96"
                                            step="1"
                                            value={fmtSizePt}
                                            onmousedown={handleColorPickMouseDown}
                                            onchange={handleFontSizeInput}
                                            title="Font size in points — highlight text (or click a merge tag) and type any size"
                                        />
                                        <button
                                            class="dg-fmt-btn"
                                            data-szstep="1"
                                            onmousedown={handleFmtMouseDown}
                                            onclick={handleFontSizeStep}
                                            title="Increase font size"
                                        >
                                            +
                                        </button>
                                        <span class="dg-fmt-sep"></span>
                                        <!-- Colour + font collapse from 19 permanent
                                             controls to 3 triggers. The popovers use the
                                             fixed-position floating layer, which is
                                             covered by smoke assertions for clipping and
                                             hit-testing — the failure mode that killed
                                             the previous attempt at this. -->
                                        <div class="dg-fmt-menu-wrap">
                                            <button
                                                class="dg-fmt-btn dg-fmt-trigger"
                                                data-menu="textColor"
                                                onmousedown={handleFmtMouseDown}

                                                title="Text colour"
                                                aria-haspopup="true"

                                                <span class="dg-fmt-trigger-glyph">A</span>
                                                <span class="dg-fmt-trigger-bar" style={textColorBarStyle}></span>
                                            </button>
                                            <template if:true={isTextColorMenuOpen}>
                                                <div class="dg-fmt-menu" role="menu">
                                                    <div class="dg-fmt-menu-label">Text colour</div>

                                                                class="dg-fmt-swatch"
                                                                style={sw.style}

                                        <div class="dg-fmt-menu-wrap">
                                            <button
                                                class="dg-fmt-btn dg-fmt-trigger"
                                                data-menu="highlight"
                                                onmousedown={handleFmtMouseDown}

                                            &#8631; Redo

                                        <!-- Header/footer tools are CONTEXTUAL, same idiom as the
                                         table row below: page counters are meaningless in the
                                         body and only work in a running header or footer, so
                                         they appear exactly when the caret is in one.
                                         These used to be the only reason to open a separate
                                         "Header/Footer" panel, which also carried raw-HTML
                                         textareas for the same two fields — a second editor,
                                         in a different medium, for something already editable
                                         in place on the page. -->
                                        <template if:true={caretInChrome}>
                                            <span class="dg-fmt-break"></span>
                                            <span
                                                class="dg-fmt-label"
                                                title="You are editing the running header/footer — it repeats on every PDF page"
                                                >{activeChromeLabel}</span
                                            >
                                            <button
                                                class="dg-fmt-btn dg-fmt-btn_word"
                                                data-tok="pagexy"
                                                onmousedown={handleFmtMouseDown}
                                                onclick={handleHfTokenInsert}
                                                title="Insert a page counter — only works in the header/footer"
                                            >
                                                Page X of Y
                                            </button>
                                            <button
                                                class="dg-fmt-btn dg-fmt-btn_word"
                                                data-tok="pagenum"
                                                onmousedown={handleFmtMouseDown}
                                                onclick={handleHfTokenInsert}
                                                title="Insert the current page number"
                                            >
                                                Page #
                                            </button>
                                            <button
                                                class="dg-fmt-btn dg-fmt-btn_word"
                                                data-tok="pagetotal"
                                                onmousedown={handleFmtMouseDown}
                                                onclick={handleHfTokenInsert}
                                                title="Insert the total page count"
                                            >
                                                Total pages
                                            </button>
                                            <button
                                                class="dg-fmt-btn dg-fmt-btn_word"
                                                data-tok="today"
                                                onmousedown={handleFmtMouseDown}
                                                onclick={handleHfTokenInsert}
                                                title="Insert today's date"
                                            >
                                                Today
                                            </button>
                                        </template>
                                        <!-- Table tools are CONTEXTUAL: ~45 controls that are only
                                         meaningful inside a table, and which otherwise sat on
                                         screen permanently whether or not the document had one. -->
                                        <template if:true={caretInTable}>
                                            <span class="dg-fmt-break"></span>
                                            <span
                                                class="dg-fmt-label"
                                                title="Table tools — put your cursor in a cell first"
                                                >Table</span
                                            >
                                            <button
                                                class="dg-fmt-btn dg-fmt-btn_word"
                                                data-taction="rowAfter"
                                                onmousedown={handleFmtMouseDown}
                                                onclick={handleTableAction}
                                                title="Add a row below the current cell"
                                            >
                                                + Row
                                            </button>
                                            <button
                                                class="dg-fmt-btn dg-fmt-btn_word"
                                                data-taction="colAfter"
                                                onmousedown={handleFmtMouseDown}
                                                onclick={handleTableAction}
                                                title="Add a column to the right of the current cell"
                                            >
                                                + Col
                                            </button>
                                            <button
                                                class="dg-fmt-btn dg-fmt-btn_word"
                                                data-taction="rowDel"
                                                onmousedown={handleFmtMouseDown}
                                                onclick={handleTableAction}
                                                title="Delete the current row"
                                            >
                                                − Row
                                            </button>
                                            <button
                                                class="dg-fmt-btn dg-fmt-btn_word"
                                                data-taction="colDel"
                                                onmousedown={handleFmtMouseDown}
                                                onclick={handleTableAction}
                                                title="Delete the current column"
                                            >
                                                − Col
                                            </button>
                                            <button
                                                class="dg-fmt-btn dg-fmt-btn_word"
                                                data-taction="mergeCells"
                                                onmousedown={handleFmtMouseDown}
                                                onclick={handleTableAction}
                                                title="Merge cells — select across cells (click first, shift-click last) then Merge; with just a caret, merges with the cell to the right"
                                            >
                                                Merge
                                            </button>
                                            <button
                                                class="dg-fmt-btn dg-fmt-btn_word"
                                                data-taction="splitCell"
                                                onmousedown={handleFmtMouseDown}
                                                onclick={handleTableAction}
                                                title="Split a merged cell back into its grid cells"
                                            >
                                                Split
                                            </button>
                                            <button
                                                class="dg-fmt-btn dg-fmt-btn_word"
                                                data-taction="headerRow"
                                                onmousedown={handleFmtMouseDown}
                                                onclick={handleTableAction}
                                                title="Style the current row as a header (navy fill, white bold text)"
                                            >
                                                Header Row
                                            </button>
                                            <button
                                                class="dg-fmt-btn dg-fmt-btn_word"
                                                data-taction="repeatHeader"
                                                onmousedown={handleFmtMouseDown}
                                                onclick={handleTableAction}
                                                title="Repeat this table's header row at the top of every PDF page it spans (toggles the {RepeatHeader} marker)"
                                            >
                                                Repeat Hdr
                                            </button>
                                            <span class="dg-fmt-sep"></span>
                                            <!-- #246 — vertical alignment. top/middle/bottom are the
                                             only values CSS 2.1 allows on a table cell, so they are
                                             the only ones Flying Saucer will honor. -->
                                            <span
                                                class="dg-fmt-label"
                                                title="Vertical alignment of cell contents — applies to the selected cells"
                                                >V-Align</span
                                            >
                                            <button
                                                class="dg-fmt-btn dg-fmt-btn_word"
                                                data-taction="vAlign"
                                                data-value="top"
                                                onmousedown={handleFmtMouseDown}
                                                onclick={handleTableAction}
                                                title="Align cell contents to the top"
                                            >
                                                &#8593; Top
                                            </button>
                                            <button
                                                class="dg-fmt-btn dg-fmt-btn_word"
                                                data-taction="vAlign"
                                                data-value="middle"
                                                onmousedown={handleFmtMouseDown}
                                                onclick={handleTableAction}
                                                title="Centre cell contents vertically"
                                            >
                                                &#8597; Middle
                                            </button>
                                            <button
                                                class="dg-fmt-btn dg-fmt-btn_word"
                                                data-taction="vAlign"
                                                data-value="bottom"
                                                onmousedown={handleFmtMouseDown}
                                                onclick={handleTableAction}
                                                title="Align cell contents to the bottom"
                                            >
                                                &#8595; Bottom
                                            </button>
                                            <span class="dg-fmt-sep"></span>
                                            <!-- #242 — whole-table properties -->
                                            <span
                                                class="dg-fmt-label"
                                                title="Whole-table settings — put your cursor in the table first"
                                                >Table&nbsp;Props</span
                                            >
                                            <button
                                                class="dg-fmt-btn dg-fmt-btn_word"
                                                data-taction="distributeCols"
                                                onmousedown={handleFmtMouseDown}
                                                onclick={handleTableAction}
                                                title="Make every column the same width"
                                            >
                                                Equal Cols
                                            </button>
                                            <button
                                                class="dg-fmt-btn dg-fmt-btn_word"
                                                data-taction="tableWidth"
                                                data-value="100%"
                                                onmousedown={handleFmtMouseDown}
                                                onclick={handleTableAction}
                                                title="Stretch the table to the full page width"
                                            >
                                                Full Width
                                            </button>
                                            <button
                                                class="dg-fmt-btn dg-fmt-btn_word"
                                                data-taction="vAlignTable"
                                                data-value="middle"
                                                onmousedown={handleFmtMouseDown}
                                                onclick={handleTableAction}
                                                title="Centre every cell in this table vertically"
                                            >
                                                All Middle
                                            </button>
                                            <select
                                                class="dg-page-select"
                                                title="Cell padding for the whole table"
                                                onmousedown={handleColorPickMouseDown}
                                                onchange={handleCellPaddingChange}
                                            >
                                                <template for:each={cellPaddingOptions} for:item="opt">
                                                    <option key={opt.value} value={opt.value} selected={opt.selected}>
                                                        {opt.label}
                                                    </option>
                                                </template>
                                            </select>
                                            <select
                                                class="dg-page-select"
                                                title="Horizontal placement of the table on the page"
                                                onmousedown={handleColorPickMouseDown}
                                                onchange={handleTableAlignChange}
                                            >
                                                <template for:each={tableAlignOptions} for:item="opt">
                                                    <option key={opt.value} value={opt.value} selected={opt.selected}>
                                                        {opt.label}
                                                    </option>
                                                </template>
                                            </select>
                                            <span class="dg-fmt-sep"></span>
                                            <!--
                                              ONE GROUP, never split. .dg-format-bar is a flat
                                              flex-wrap list, so it used to break wherever it ran
                                              out of width — which put the "Borders" label at the
                                              end of one row and its own buttons at the start of
                                              the next. The label pointed at nothing and the
                                              buttons belonged to nothing, and the whole bar
                                              reshuffled as the window resized.
                                            -->
                                            <div class="dg-fmt-group">
                                                <span
                                                    class="dg-fmt-label"
                                                    title="Table borders — every control here applies to the selected cells, or to the whole table when nothing is selected"
                                                    >Borders</span
                                                >
                                                <button
                                                    class="dg-fmt-btn dg-fmt-btn_word"
                                                    data-taction="bordersAll"
                                                    onmousedown={handleFmtMouseDown}
                                                    onclick={handleTableAction}
                                                    title="Full grid — every cell outlined"
                                                >
                                                    All
                                                </button>
                                                <button
                                                    class="dg-fmt-btn dg-fmt-btn_word"
                                                    data-taction="bordersOutline"
                                                    onmousedown={handleFmtMouseDown}
                                                    onclick={handleTableAction}
                                                    title="Outline around the table only"
                                                >
                                                    Outline
                                                </button>
                                                <button
                                                    class="dg-fmt-btn dg-fmt-btn_word"
                                                    data-taction="bordersRows"
                                                    onmousedown={handleFmtMouseDown}
                                                    onclick={handleTableAction}
                                                    title="Horizontal row lines only"
                                                >
                                                    Rows
                                                </button>
                                                <button
                                                    class="dg-fmt-btn dg-fmt-btn_word"
                                                    data-taction="bordersNone"
                                                    onmousedown={handleFmtMouseDown}
                                                    onclick={handleTableAction}
                                                    title="No borders"
                                                >
                                                    None
                                                </button>
                                                <!--
                                              Both border controls are SCOPE-AWARE and always were:
                                              with cells selected they restyle just those cells, with
                                              only a caret they restyle the whole table. The tooltips
                                              used to promise "the table under the cursor" in both
                                              cases, so the selected-cells behaviour read as the
                                              control ignoring you rather than doing something useful.
                                            -->
                                                <select
                                                    class="dg-page-select"
                                                    title="Border thickness — applies to the selected cells, or to the whole table when nothing is selected"
                                                    onmousedown={handleColorPickMouseDown}
                                                    onchange={handleBorderWidthChange}
                                                >
                                                    <template for:each={borderWidthOptions} for:item="opt">
                                                        <option
                                                            key={opt.value}
                                                            value={opt.value}
                                                            selected={opt.selected}
                                                        >
                                                            {opt.label}
                                                        </option>
                                                    </template>
                                                </select>
                                                <input
                                                    type="color"
                                                    class="dg-fmt-colorpick"
                                                    title="Border color — applies to the selected cells, or to the whole table when nothing is selected"
                                                    value={borderColorValue}
                                                    onmousedown={handleColorPickMouseDown}
                                                    oninput={handleBorderColorChange}
                                                    onchange={handleBorderColorChange}
                                                />
                                            </div>
                                            <div class="dg-fmt-group">
                                                <span
                                                    class="dg-fmt-label"
                                                    title="Fill the current cell — or, outside a table, the paragraph/panel the cursor is in"
                                                    >Fill</span
                                                >
                                                <template for:each={highlightSwatches} for:item="sw">
                                                    <button
                                                        key={sw.key}
                                                        class="dg-fmt-swatch"
                                                        style={sw.style}
                                                        data-taction="cellFill"
                                                        data-value={sw.value}
                                                        onmousedown={handleFmtMouseDown}
                                                        onclick={handleTableAction}
                                                        title={sw.title}
                                                    ></button>
                                                </template>
                                                <input
                                                    type="color"
                                                    class="dg-fmt-colorpick"
                                                    data-cmd="cellFill"
                                                    value="#f2f4f7"
                                                    onmousedown={handleColorPickMouseDown}
                                                    onchange={handleColorPickChange}
                                                    title="Custom cell fill color"
                                                />
                                            </div>
                                        </template>
                                    </div>
                                    <!-- #247 — the running header is page chrome, so it
                                         belongs ON the page, not behind a panel button.
                                         Same editing surface as the body: rail chips drag
                                         in, the format bar applies, tables work. Writes to
                                         Header_Html__c rather than the body. -->
                                    <div class="dg-sheet">
                                        <!-- The paper itself — header band, page and footer
                                         band as one object. It exists so the editing
                                         outline can enclose ALL THREE: drawn on the page
                                         alone it boxed the body and left the running
                                         header outside it, which said "the document is
                                         this rectangle and the header is not part of
                                         it" — the opposite of what the sheet is for.
                                         Sized by its widest child, so it is exactly the
                                         page width with no measurement to keep in sync. -->
                                        <div class="dg-sheet-paper" onmouseleave={handleCanvasMouseLeave}>
                                            <div
                                                class="dg-chrome-band dg-chrome-band_header"
                                                lwc:dom="manual"
                                                data-surface="header"
                                                data-band-label="Header"
                                                title="Running header — the top margin of the page. Click in and type; it repeats on every PDF page."
                                            ></div>
                                            <!-- #241 — the table row/column handles are rendered
                                         HERE, as LWC-owned siblings of the canvas, never
                                         inside it. The canvas is serialized back to the
                                         template body, so any chrome placed within it
                                         would have to be stripped again on the way out;
                                         keeping it outside makes that impossible by
                                         construction. Positioned over the canvas by
                                         getBoundingClientRect math. -->
                                            <!-- Selection bubble — the third chrome layer,
                                         alongside the persistent bar and slash menu.
                                         position: fixed in viewport coordinates so no
                                         ancestor's overflow can clip it (the failure
                                         mode that killed the previous rewrite), and
                                         placed ABOVE the selection so it never covers
                                         the text being formatted. -->
                                            <template if:true={selectionBubble}>
                                                <div
                                                    class="dg-sel-bubble"
                                                    role="toolbar"
                                                    aria-label="Selection formatting"
                                                >
                                                    <button
                                                        class={boldBtnClass}
                                                        data-cmd="bold"
                                                        onmousedown={handleFmtMouseDown}
                                                        onclick={handleFormatAction}
                                                        title="Bold"
                                                    >
                                                        <b>B</b>
                                                    </button>
                                                    <button
                                                        class={italicBtnClass}
                                                        data-cmd="italic"
                                                        onmousedown={handleFmtMouseDown}
                                                        onclick={handleFormatAction}
                                                        title="Italic"
                                                    >
                                                        <i>I</i>
                                                    </button>
                                                    <button
                                                        class={underlineBtnClass}
                                                        data-cmd="underline"
                                                        onmousedown={handleFmtMouseDown}
                                                        onclick={handleFormatAction}
                                                        title="Underline"
                                                    >
                                                        <u>U</u>
                                                    </button>
                                                    <button
                                                        class={strikeBtnClass}
                                                        data-cmd="strikeThrough"
                                                        onmousedown={handleFmtMouseDown}
                                                        onclick={handleFormatAction}
                                                        title="Strikethrough"
                                                    >
                                                        <s>S</s>
                                                    </button>
                                                    <span class="dg-sel-bubble-sep"></span>
                                                    <template for:each={bubbleColorSwatches} for:item="sw">
                                                        <button
                                                            key={sw.key}
                                                            class="dg-fmt-swatch"
                                                            style={sw.style}
                                                            data-cmd="foreColor"
                                                            data-value={sw.value}
                                                            onmousedown={handleFmtMouseDown}
                                                            onclick={handleFormatAction}
                                                            title={sw.title}
                                                        ></button>
                                                    </template>
                                                    <span class="dg-sel-bubble-sep"></span>
                                                    <button
                                                        class="dg-fmt-btn dg-fmt-btn_word"
                                                        data-cmd="removeFormat"
                                                        onmousedown={handleFmtMouseDown}
                                                        onclick={handleFormatAction}
                                                        title="Clear formatting"
                                                    >
                                                        Clear
                                                    </button>
                                                </div>
                                            </template>
                                            <div class="dg-canvas-wrap">
                                                <div
                                                    class="dg-html-preview-frame dg-visual-host dg-designer-size"
                                                    lwc:dom="manual"
                                                    title="Visual editing — click into the page and type"
                                                ></div>
                                                <template if:true={tableGhost}>
                                                    <div class={tableGhost.cls} style={tableGhost.style}></div>
                                                </template>
                                                <template if:true={tableOverlay}>
                                                    <!-- Column gutter, above the table -->
                                                    <template for:each={tableOverlay.cols} for:item="col">
                                                        <div
                                                            key={col.key}
                                                            class="dg-tbl-handle dg-tbl-handle_col"
                                                            style={col.style}
                                                            data-index={col.index}
                                                            onmouseenter={handleTableHandleEnter}
                                                            onmouseleave={handleTableHandleLeave}
                                                        >
                                                            <!--
                                                              DELETE ONLY. The "+" that used to sit here
                                                              inserted a column too, duplicating the
                                                              circular seam on the boundary — two controls,
                                                              one action, side by side, which is most of
                                                              why this gutter looked so busy.
                                                              The seam wins because it is unambiguous: it
                                                              sits ON the boundary the new column lands at,
                                                              whereas "Insert a column here" over a column
                                                              never says whether "here" is before or after.
                                                            -->
                                                            <button
                                                                class="dg-tbl-handle-btn dg-tbl-handle-btn_del"
                                                                data-index={col.index}
                                                                data-axis="col"
                                                                onmouseenter={handleRemovePreview}
                                                                onmouseleave={handleGhostClear}
                                                                onmousedown={handleFmtMouseDown}
                                                                onclick={handleDeleteColAt}
                                                                title="Delete this column"
                                                            >
                                                                &minus;
                                                            </button>
                                                        </div>
                                                    </template>
                                                    <!-- Row gutter, left of the table -->
                                                    <template for:each={tableOverlay.rows} for:item="row">
                                                        <div
                                                            key={row.key}
                                                            class="dg-tbl-handle dg-tbl-handle_row"
                                                            style={row.style}
                                                            data-index={row.index}
                                                            onmouseenter={handleTableHandleEnter}
                                                            onmouseleave={handleTableHandleLeave}
                                                        >
                                                            <!-- Delete only — the seams own insertion. -->
                                                            <button
                                                                class="dg-tbl-handle-btn dg-tbl-handle-btn_del"
                                                                data-index={row.index}
                                                                data-axis="row"
                                                                onmouseenter={handleRemovePreview}
                                                                onmouseleave={handleGhostClear}
                                                                onmousedown={handleFmtMouseDown}
                                                                onclick={handleDeleteRowAt}
                                                                title="Delete this row"
                                                            >
                                                                &minus;
                                                            </button>
                                                        </div>
                                                    </template>
                                                </template>
                                                <!-- Block gutter handle (Notion): appears in
                                             the left margin of the block under the
                                             pointer. LWC-owned sibling of the canvas,
                                             so it can never reach the saved body. -->
                                                <template if:true={blockHandle}>
                                                    <div class="dg-blk-handle" style={blockHandle.style}>
                                                        <button
                                                            class="dg-blk-handle-btn"
                                                            onmousedown={handleFmtMouseDown}
                                                            onclick={handleBlockInsertAfter}
                                                            title="Insert a paragraph below this block"
                                                        >
                                                            +
                                                        </button>
                                                        <button
                                                            class="dg-blk-handle-btn"
                                                            data-dir="up"
                                                            onmousedown={handleFmtMouseDown}
                                                            onclick={handleBlockMove}
                                                            title="Move this block up"
                                                        >
                                                            &#9650;
                                                        </button>
                                                        <button
                                                            class="dg-blk-handle-btn"
                                                            data-dir="down"
                                                            onmousedown={handleFmtMouseDown}
                                                            onclick={handleBlockMove}
                                                            title="Move this block down"
                                                        >
                                                            &#9660;
                                                        </button>
                                                    </div>
                                                </template>
                                                <template if:true={tableOverlay}>
                                                    <!-- Insert seams — a circular + centred on
                                                 the boundary where the new column/row
                                                 will land, so the insertion point is
                                                 never a guess (Confluence's model). -->
                                                    <template for:each={tableOverlay.seams} for:item="seam">
                                                        <button
                                                            key={seam.key}
                                                            class="dg-tbl-seam"
                                                            style={seam.style}
                                                            data-index={seam.index}
                                                            data-axis={seam.axis}
                                                            onmouseenter={handleSeamPreview}
                                                            onmouseleave={handleGhostClear}
                                                            onmousedown={handleFmtMouseDown}
                                                            onclick={handleSeamInsert}
                                                            title="Insert here"
                                                        >
                                                            +
                                                        </button>
                                                    </template>
                                                </template>
                                            </div>
                                            <!-- Running footer: the bottom margin of the same
                                             sheet, mirroring the header. -->
                                            <div
                                                class="dg-chrome-band dg-chrome-band_footer"
                                                lwc:dom="manual"
                                                data-surface="footer"
                                                data-band-label="Footer"
                                                title="Running footer — the bottom margin of the page. Click in and type; it repeats on every PDF page."
                                            ></div>
                                        </div>
                                    </div>
                                    <p class="slds-text-body_small slds-text-color_weak slds-var-m-top_xx-small">
                                        This is your document — click anywhere and type. The colored pills are your data
                                        fields. Drag anything from the rail on the right straight onto the page.
                                        Deleting a pill removes the whole field — they can't break. Your styles and page
                                        setup are never touched here.
                                    </p>
                                </template>
                            </div>

                            <template if:true={showFloatPanel}>
                                <div class={floatPanelClass}>
                                    <div class="dg-float-panel-head">
                                        <span class="dg-float-panel-title">{floatPanelTitle}</span>
                                        <button class="dg-pill-menu-x" onclick={handlePanelClose} title="Close (Esc)">
                                            &#10005;
                                        </button>
                                    </div>
                                    <template if:true={showPanelSearch}>
                                        <input
                                            type="search"
                                            class="dg-panel-search"
                                            placeholder={panelSearchPlaceholder}
                                            oninput={handlePanelSearch}
                                            autocomplete="off"
                                        />
                                    </template>
                                    <template if:true={isPanelInsert}>
                                        <p class="dg-float-panel-tip">
                                            Tip: type <code>&#96;</code> or <code>[</code> anywhere in the page for this
                                            menu at your cursor.
                                        </p>
                                        <template for:each={filteredBlockSections} for:item="section">
                                            <div key={section.key} class="dg-tag-section">
                                                <div class="dg-tag-section-label">{section.label}</div>
                                                <template if:true={section.hint}>
                                                    <div class="dg-tag-section-hint">{section.hint}</div>
                                                </template>
                                                <div class="dg-tag-chips">
                                                    <template for:each={section.items} for:item="blk">
                                                        <button
                                                            key={blk.key}
                                                            class="dg-tag-chip dg-block-chip"
                                                            data-snippet={blk.snippet}
                                                            data-kind="block"
                                                            title={blk.title}
                                                            onmousedown={handleChipDragMouseDown}
                                                            onclick={handleInsertTagSnippet}
                                                        >
                                                            {blk.label}
                                                        </button>
                                                    </template>
                                                </div>
                                            </div>
                                        </template>
                                    </template>
                                    <template if:true={isPanelTags}>
                                        <template for:each={filteredTagSections} for:item="section">
                                            <div key={section.key} class="dg-tag-section">
                                                <div class="dg-tag-section-label">{section.label}</div>
                                                <template if:true={section.hint}>
                                                    <div class="dg-tag-section-hint">{section.hint}</div>
                                                </template>
                                                <div class="dg-tag-chips">
                                                    <template for:each={section.items} for:item="tag">
                                                        <button
                                                            key={tag.key}
                                                            class="dg-tag-chip"
                                                            data-snippet={tag.snippet}
                                                            title={tag.title}
                                                            onmousedown={handleChipDragMouseDown}
                                                            onclick={handleInsertTagSnippet}
                                                        >
                                                            {tag.label}
                                                        </button>
                                                    </template>
                                                </div>
                                            </div>
                                        </template>
                                    </template>
                                    <template if:true={isPanelImages}>
                                        <div class="dg-image-panel">
                                            <p class="slds-text-body_small slds-var-m-bottom_x-small">
                                                Every image lives in the shared <strong>Asset Library</strong> and is
                                                placed by merge tag — the engine renders these natively. Add or update
                                                images under the Assets tab.
                                            </p>
                                            <template if:true={hasFilteredAssets}>
                                                <div class="dg-image-grid">
                                                    <template for:each={filteredAssets} for:item="asset">
                                                        <div
                                                            key={asset.id}
                                                            class="dg-image-thumb"
                                                            data-snippet={asset.mergeTag}
                                                            onmousedown={handleChipDragMouseDown}
                                                            onclick={handleInsertTagSnippet}
                                                            title={asset.mergeTag}
                                                        >
                                                            <template if:true={asset.previewUrl}>
                                                                <img src={asset.previewUrl} alt={asset.name} />
                                                            </template>
                                                            <span class="dg-image-thumb-name">{asset.name}</span>
                                                            <span class="dg-asset-thumb-tag">{asset.mergeTag}</span>
                                                        </div>
                                                    </template>
                                                </div>
                                            </template>
                                            <template if:false={hasFilteredAssets}>
                                                <p
                                                    class="slds-text-body_small slds-text-color_weak slds-var-m-top_x-small"
                                                >
                                                    No matching assets — add images under the Assets tab.
                                                </p>
                                            </template>
                                        </div>
                                    </template>

                                    <template if:true={isPanelQuery}>
                                        <div class="dg-image-panel">
                                            <template if:true={designerQueryTreeAvailable}>
                                                <p class="slds-text-body_small slds-var-m-bottom_x-small">
                                                    Build the query visually — start from {editTemplateObject} and walk
                                                    into fields, parent lookups, and related lists. Changes apply to the
                                                    tag palettes immediately and save with
                                                    <strong>Save as New Version</strong>.
                                                </p>
                                                <c-doc-gen-tree-builder
                                                    selected-object={editTemplateObject}
                                                    query-config={editTemplateQuery}
                                                    onconfigchange={handleEditConfigChange}
                                                >
                                                </c-doc-gen-tree-builder>
                                            </template>
                                            <template if:false={designerQueryTreeAvailable}>
                                                <p class="slds-text-body_small slds-text-color_weak">
                                                    This template's data comes from an Apex provider or Flow JSON —
                                                    manage it under
                                                    <strong>Edit Template &#8594; Query Configuration</strong>.
                                                </p>
                                            </template>
                                        </div>
                                    </template>
                                    <template if:true={isPanelVersions}>
                                        <div class="dg-image-panel">
                                            <p class="slds-text-body_small slds-var-m-bottom_x-small">
                                                Load any version into the editor to view or branch from it. Loading
                                                changes nothing — <strong>Save as New Version</strong> creates a new
                                                version from whatever is loaded.
                                            </p>
                                            <template for:each={versions} for:item="ver">
                                                <div key={ver.Id} class="dg-version-row">
                                                    <div class="dg-version-meta">
                                                        <span class={ver.activeClass}
                                                            >{ver.VersionNumber} {ver.isActiveLabel}</span
                                                        >
                                                        <span class="dg-version-file">{ver.bodyCvFileName}</span>
                                                    </div>
                                                    <button
                                                        class="dg-tag-chip"
                                                        data-cvid={ver.bodyCvId}
                                                        data-ver={ver.VersionNumber}
                                                        onclick={handleLoadVersionIntoDesigner}
                                                    >
                                                        Load
                                                    </button>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                    <template if:true={isPanelHf}>
                                        <div class="dg-image-panel">
                                            <!-- Not an editor any more. The running header and
                                             footer are edited in place on the sheet, with the
                                             same toolbar, chips, drag-and-drop and undo as the
                                             body; page counters appear in the format bar when
                                             the caret is in one. This panel used to carry raw
                                             HTML textareas for the same two fields, which meant
                                             two editors in two different media for one thing —
                                             and the textareas silently lost anything richer
                                             than text. It is now just a way to get there. -->
                                            <p class="slds-text-body_small slds-var-m-bottom_x-small">
                                                Your running header and footer are the top and bottom bands of the page
                                                itself &mdash; click into one and type. Everything works there that
                                                works in the body: formatting, tables, images, merge tags, and
                                                drag-and-drop from this rail.
                                            </p>
                                            <div class="dg-tag-chips slds-var-m-bottom_x-small">
                                                <button
                                                    class="dg-tag-chip"
                                                    data-surface="header"
                                                    onclick={handleJumpToBand}
                                                    title="Put the cursor in the running header"
                                                >
                                                    Edit header &#8593;
                                                </button>
                                                <button
                                                    class="dg-tag-chip"
                                                    data-surface="footer"
                                                    onclick={handleJumpToBand}
                                                    title="Put the cursor in the running footer"
                                                >
                                                    Edit footer &#8595;
                                                </button>
                                            </div>
                                            <p class="slds-text-body_small slds-text-color_weak slds-var-m-top_x-small">
                                                Page counters (<strong>Page X of Y</strong>) appear in the toolbar while
                                                your cursor is in the header or footer. With page counters the engine
                                                uses plain-text margin boxes; without them, full HTML &mdash; including
                                                images &mdash; renders as a running band.
                                            </p>
                                        </div>
                                    </template>
                                    <template if:true={isPanelWatermark}>
                                        <div class="dg-image-panel">
                                            <p class="slds-text-body_small slds-var-m-bottom_x-small">
                                                Full-page background image behind your content (PDF output). Pre-fade
                                                the image (~15-20% opacity over white) for a watermark look. Needs a
                                                saved version first.
                                            </p>
                                            <template if:true={watermarkPreviewUrl}>
                                                <div class="dg-watermark-preview">
                                                    <img src={watermarkPreviewUrl} alt="Current watermark" />
                                                    <lightning-button
                                                        label="Remove"
                                                        icon-name="utility:delete"
                                                        variant="destructive-text"
                                                        onclick={handleClearWatermark}
                                                        disabled={isUploadingWatermark}
                                                    ></lightning-button>
                                                </div>
                                            </template>
                                            <div class="slds-var-m-top_x-small">
                                                <label class="slds-form-element__label" for="wm-opacity"
                                                    >Watermark strength</label
                                                >
                                                <select
                                                    class="dg-page-select"
                                                    title="Opacity is baked into the image on upload so the PDF matches exactly"
                                                    onchange={handleWatermarkOpacityChange}
                                                >
                                                    <template for:each={watermarkOpacityOptions} for:item="opt">
                                                        <option
                                                            key={opt.value}
                                                            value={opt.value}
                                                            selected={opt.selected}
                                                        >
                                                            {opt.label}
                                                        </option>
                                                    </template>
                                                </select>
                                            </div>
                                            <input
                                                type="file"
                                                accept="image/*"
                                                onchange={handleWatermarkFileSelected}
                                                disabled={isUploadingWatermark}
                                                class="slds-var-m-top_x-small"
                                            />
                                            <template if:true={isUploadingWatermark}>
                                                <p class="slds-text-body_small slds-var-m-top_x-small">Uploading…</p>
                                            </template>
                                        </div>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </template>
                </div>
            </lightning-tab>
        </lightning-tabset>
    </div>

    <!-- Edit Template Modal -->
    <template if:true={isEditModalOpen}>
        <section
            role="dialog"
            tabindex="-1"
            aria-modal="true"
            aria-labelledby="edit-template-modal-title"
            onkeydown={handleEditModalKeydown}
            class="slds-modal slds-fade-in-open slds-modal_large"
        >
            <div class="slds-modal__container modern-modal">
                <header class="slds-modal__header">
                    <lightning-button-icon
                        icon-name="utility:close"
                        alternative-text="Close"
                        title="Close"
                        variant="bare"
                        class="slds-button slds-button_icon slds-modal__close"
                        onclick={handleCloseEditModal}
                    ></lightning-button-icon>
                    <h2 id="edit-template-modal-title" class="slds-text-heading_medium slds-hyphenate">
                        Edit Template Configuration
                    </h2>
                </header>
                <div class="slds-modal__content slds-var-p-around_medium">
                    <!-- Sample Record (persistent across all tabs) — hidden for Apex providers -->
                    <template if:true={isRealObject}>
                        <div class="edit-sample-toolbar">
                            <lightning-icon
                                icon-name="utility:record"
                                size="x-small"
                                alternative-text="Sample Record"
                            ></lightning-icon>
                            <div class="edit-sample-toolbar__picker">
                                <lightning-record-picker
                                    label="Sample Record"
                                    variant="label-hidden"
                                    object-api-name={editTemplateObject}
                                    value={editTemplateTestRecordId}
                                    onchange={handleEditTestRecordChange}
                                    placeholder="Set a sample record for previews..."
                                >
                                </lightning-record-picker>
                            </div>
                            <template if:true={editTemplateTestRecordId}>
                                <span class="edit-sample-toolbar__id slds-text-body_small slds-text-color_weak">
                                    ID: {editTemplateTestRecordId}
                                </span>
                            </template>
                            <lightning-button
                                label="Generate Sample"
                                icon-name="utility:page"
                                variant="brand"
                                onclick={handleTestGenerate}
                                disabled={editGenerateSampleDisabled}
                            ></lightning-button>
                            <template if:true={isLoadingVersions}>
                                <lightning-spinner
                                    alternative-text="Generating..."
                                    size="small"
                                    variant="brand"
                                ></lightning-spinner>
                            </template>
                        </div>
                    </template>

                    <lightning-tabset variant="scoped" active-tab-value={activeEditTab}>
                        <!-- Tab 1: Settings -->
                        <lightning-tab label="Settings" value="details">
                            <!-- Grouped into balanced sections so the tab fits without heavy scrolling -->
                            <div class="slds-var-p-around_small">
                                <h3 class="slds-text-heading_small slds-var-m-bottom_x-small">Template</h3>
                                <div class="slds-grid slds-gutters_large">
