                                                        <th scope="col">Type</th>
                                                        <th scope="col">Mapped Field</th>
                                                        <th scope="col">Required</th>
                                                        <th scope="col">Write Back</th>
                                                        <th scope="col">On Certificate</th>
                                                        <th scope="col">Merge Tag</th>
                                                        <th scope="col">Order</th>
                                                        <th scope="col"></th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    <template for:each={signerFieldRows} for:item="row">
                                                        <tr key={row.key} class="pdf-acroform-row">
                                                            <td>
                                                                <lightning-input
                                                                    type="text"
                                                                    variant="label-hidden"
                                                                    value={row.label}
                                                                    data-index={row.index}
                                                                    placeholder="Field label"
                                                                    onchange={handleSignerFieldLabelChange}
                                                                ></lightning-input>
                                                                <template if:true={row.isPicklist}>
                                                                    <lightning-input
                                                                        class="slds-var-m-top_xx-small"
                                                                        type="text"
                                                                        variant="label-hidden"
                                                                        value={row.choicesText}
                                                                        data-index={row.index}
                                                                        placeholder="Choices, comma-separated"
                                                                        onchange={handleSignerFieldChoicesChange}
                                                                    ></lightning-input>
                                                                </template>
                                                            </td>
                                                            <td>
                                                                <lightning-combobox
                                                                    variant="label-hidden"
                                                                    value={row.type}
                                                                    data-index={row.index}
                                                                    options={signerFieldTypeOptions}
                                                                    onchange={handleSignerFieldTypeChange}
                                                                ></lightning-combobox>
                                                            </td>
                                                            <td>
                                                                <lightning-combobox
                                                                    variant="label-hidden"
                                                                    value={row.fieldApiName}
                                                                    data-index={row.index}
                                                                    placeholder="Select field"
                                                                    options={row.fieldOptions}
                                                                    onchange={handleSignerFieldMappedChange}
                                                                ></lightning-combobox>
                                                            </td>
                                                            <td>
                                                                <lightning-input
                                                                    type="toggle"
                                                                    variant="label-hidden"
                                                                    checked={row.required}
                                                                    data-index={row.index}
                                                                    message-toggle-active=""
                                                                    message-toggle-inactive=""
                                                                    onchange={handleSignerFieldRequiredChange}
                                                                ></lightning-input>
                                                            </td>
                                                            <td>
                                                                <lightning-input
                                                                    type="toggle"
                                                                    variant="label-hidden"
                                                                    checked={row.writeback}
                                                                    data-index={row.index}
                                                                    message-toggle-active=""
                                                                    message-toggle-inactive=""
                                                                    onchange={handleSignerFieldWritebackChange}
                                                                ></lightning-input>
                                                            </td>
                                                            <td>
                                                                <lightning-input
                                                                    type="toggle"
                                                                    variant="label-hidden"
                                                                    checked={row.listOnCertificate}
                                                                    data-index={row.index}
                                                                    message-toggle-active=""
                                                                    message-toggle-inactive=""
                                                                    onchange={handleSignerFieldCertificateChange}
                                                                ></lightning-input>
                                                            </td>
                                                            <td>
                                                                <code
                                                                    class="tag-click"
                                                                    data-tag={row.mergeTag}
                                                                    onclick={handleCopyEditTag}
                                                                    >{row.mergeTag}</code
                                                                >
                                                            </td>
                                                            <td>
                                                                <lightning-button-icon
                                                                    icon-name="utility:up"
                                                                    alternative-text="Move up"
                                                                    title="Move up"
                                                                    variant="border-filled"
                                                                    data-index={row.index}
                                                                    disabled={row.isFirst}
                                                                    onclick={handleMoveSignerFieldUp}
                                                                ></lightning-button-icon>
                                                                <lightning-button-icon
                                                                    icon-name="utility:down"
                                                                    alternative-text="Move down"
                                                                    title="Move down"
                                                                    variant="border-filled"
                                                                    data-index={row.index}
                                                                    disabled={row.isLast}
                                                                    onclick={handleMoveSignerFieldDown}
                                                                ></lightning-button-icon>
                                                            </td>
                                                            <td>
                                                                <lightning-button-icon
                                                                    icon-name="utility:delete"
                                                                    alternative-text="Remove field"
                                                                    title="Remove field"
                                                                    variant="border-filled"
                                                                    data-index={row.index}
                                                                    onclick={handleRemoveSignerField}
                                                                ></lightning-button-icon>
                                                            </td>
                                                        </tr>
                                                    </template>
                                                </tbody>
                                            </table>
                                        </div>
                                    </template>
                                    <template if:false={hasSignerFields}>
                                        <div class="slds-box slds-theme_shade slds-text-align_center">
                                            <lightning-icon icon-name="utility:edit_form" size="small"></lightning-icon>
                                            <p class="slds-text-body_small slds-text-color_weak slds-var-m-top_x-small">
                                                No signer form fields yet. Add a field to collect input during signing
                                                and place its <code>&lbrace;?key&rbrace;</code> tag in the template.
                                            </p>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </lightning-tab>

                        <!-- Tab 3: Template Tags -->
                        <lightning-tab label="Copy-Paste Tags" value="tags">
                            <div class="slds-var-p-around_small">
                                <div class="slds-var-m-bottom_medium">
                                    <p class="slds-text-body_small slds-text-color_weak">
                                        Click any tag to copy it. Paste directly into your Word or Excel template.
                                    </p>
                                </div>
                                <div
                                    class="slds-box slds-theme_shade"
                                    style="border-radius: 8px; max-height: 500px; overflow-y: auto"
                                >
                                    <template if:true={editTemplateTags}>
                                        <template for:each={editTemplateTags} for:item="section">
                                            <div key={section.name} class="slds-var-m-bottom_medium">
                                                <h4 class="slds-text-heading_small slds-var-m-bottom_small">
                                                    {section.name}
                                                </h4>
                                                <template if:true={section.isLoop}>
                                                    <div class="slds-var-m-bottom_small">
                                                        <code
                                                            class="tag-click"
                                                            data-tag={section.loopStart}
                                                            onclick={handleCopyEditTag}
                                                            >{section.loopStart}</code
                                                        >
                                                        <span
                                                            class="slds-text-body_small slds-text-color_weak slds-var-m-horizontal_small"
                                                            >...content...</span
                                                        >
                                                        <code
                                                            class="tag-click"
                                                            data-tag={section.loopEnd}
                                                            onclick={handleCopyEditTag}
                                                            >{section.loopEnd}</code
                                                        >
                                                    </div>
                                                </template>
                                                <div style="display: flex; flex-wrap: wrap; gap: 8px">
                                                    <template for:each={section.tags} for:item="tag">
                                                        <code
                                                            key={tag.code}
                                                            class="tag-click"
                                                            data-tag={tag.code}
                                                            onclick={handleCopyEditTag}
                                                            >{tag.code}</code
                                                        >
                                                    </template>
                                                </div>
                                            </div>
                                        </template>
                                    </template>
                                    <template if:false={editTemplateTags}>
                                        <p class="slds-text-body_small slds-text-color_weak">
                                            No tags configured. Edit the query configuration to add fields.
                                        </p>
                                    </template>
                                </div>
                            </div>
                        </lightning-tab>

                        <template if:true={isEditTypePdf}>
                            <lightning-tab label="Fillable Fields" value="pdfFields">
                                <div class="slds-var-p-around_small">
                                    <template if:true={hasUploadedPdfAcroFormFields}>
                                        <div class="pdf-acroform-mapping">
                                            <div class="pdf-acroform-mapping__header">
                                                <div class="slds-media slds-media_center">
                                                    <div class="slds-media__figure">
                                                        <lightning-icon icon-name="utility:form" size="small">
                                                        </lightning-icon>
                                                    </div>
                                                    <div class="slds-media__body">
                                                        <h3 class="slds-text-heading_small">Fillable Field Mapping</h3>
                                                        <p class="slds-text-body_small slds-text-color_weak">
                                                            {pdfAcroFormMappedCount} of {pdfAcroFormFieldCount} mapped
                                                        </p>
                                                        <p class="slds-text-body_small slds-text-color_weak">
                                                            {pdfAcroFormMappingStatusText}
                                                        </p>
                                                    </div>
                                                </div>
                                                <div class="pdf-acroform-mapping__actions">
                                                    <lightning-button-icon
                                                        icon-name="utility:refresh"
                                                        alternative-text="Reload mapping"
                                                        title="Reload mapping"
                                                        variant="border-filled"
                                                        onclick={handleReloadPdfAcroFormMapping}
                                                    ></lightning-button-icon>
                                                    <lightning-button
                                                        label="Save Mapping"
                                                        icon-name="utility:save"
                                                        variant="brand"
                                                        onclick={handleSavePdfAcroFormMapping}
                                                        disabled={isPdfAcroFormSaveMappingDisabled}
                                                    ></lightning-button>
                                                    <lightning-button-icon
                                                        icon-name="utility:close"
                                                        alternative-text="Clear mappings"
                                                        title="Clear mappings"
                                                        variant="border-filled"
                                                        onclick={handleClearPdfAcroFormMappings}
                                                    ></lightning-button-icon>
                                                </div>
                                            </div>
                                            <template if:true={isPreparingPdfAcroFormBody}>
                                                <div class="pdf-acroform-mapping__preparing">
                                                    <lightning-spinner
                                                        alternative-text="Preparing PDF..."
                                                        size="small"
                                                    ></lightning-spinner>
                                                    <span>{pdfAcroFormPreparationText}</span>
                                                </div>
                                            </template>
                                            <div class="pdf-acroform-mapping__tools">
                                                <div class="pdf-acroform-mapping__search">
                                                    <lightning-input
                                                        type="search"
                                                        label="Search fillable fields"
                                                        variant="label-hidden"
                                                        value={pdfAcroFormSearchTerm}
                                                        placeholder="Search field, page, position, data path..."
                                                        onchange={handlePdfAcroFormSearchChange}
                                                    ></lightning-input>
                                                </div>
                                                <div class="pdf-acroform-mapping__filter">
                                                    <lightning-combobox
                                                        label="Filter fillable fields"
                                                        variant="label-hidden"
                                                        value={pdfAcroFormFilter}
                                                        options={pdfAcroFormFilterOptions}
                                                        onchange={handlePdfAcroFormFilterChange}
                                                    ></lightning-combobox>
                                                </div>
                                                <span class="slds-text-body_small slds-text-color_weak">
                                                    Showing {pdfAcroFormVisibleFieldCount} of {pdfAcroFormFieldCount}
                                                </span>
                                            </div>
                                            <div class="pdf-acroform-mapping__scroll">
                                                <table class="pdf-acroform-mapping__table">
                                                    <thead>
                                                        <tr>
                                                            <th scope="col">Label / Fillable Field</th>
                                                            <th scope="col">Type</th>
                                                            <th scope="col">Position</th>
                                                            <th scope="col">Data Path</th>
                                                            <th scope="col">Checked Value</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        <template for:each={pdfAcroFormFieldRows} for:item="row">
                                                            <tr key={row.key} class={row.rowClass}>
                                                                <td>
                                                                    <lightning-input
                                                                        type="text"
                                                                        variant="label-hidden"
                                                                        value={row.friendlyLabel}
                                                                        data-index={row.index}
                                                                        placeholder="Add label"
                                                                        onchange={handlePdfAcroFormFriendlyLabelChange}
                                                                    ></lightning-input>
                                                                    <div class="pdf-acroform-field-name">
                                                                        {row.displayName}
                                                                    </div>
                                                                    <template if:true={row.partialName}>
                                                                        <div
                                                                            class="slds-text-body_small slds-text-color_weak"
                                                                        >
                                                                            {row.partialName}
                                                                        </div>
                                                                    </template>
                                                                </td>
                                                                <td>{row.fieldType}</td>
                                                                <td>
                                                                    <template if:true={row.pageLabel}>
                                                                        <div>{row.pageLabel}</div>
                                                                    </template>
                                                                    <template if:true={row.locationLabel}>
                                                                        <div
                                                                            class="slds-text-body_small slds-text-color_weak"
                                                                        >
                                                                            {row.locationLabel}
                                                                        </div>
                                                                    </template>
                                                                    <template if:true={row.positionText}>
                                                                        <div
                                                                            class="slds-text-body_small slds-text-color_weak"
                                                                        >
                                                                            {row.positionText}
                                                                        </div>
                                                                    </template>
                                                                </td>
                                                                <td>
                                                                    <template if:true={hasPdfAcroFormDataPathOptions}>
                                                                        <lightning-combobox
                                                                            variant="label-hidden"
                                                                            value={row.mappedPath}
                                                                            data-index={row.index}
                                                                            placeholder="Select query field"
                                                                            options={pdfAcroFormDataPathOptions}
                                                                            onchange={handlePdfAcroFormMappingChange}
                                                                        ></lightning-combobox>
                                                                    </template>
                                                                    <template if:false={hasPdfAcroFormDataPathOptions}>
                                                                        <lightning-input
                                                                            type="text"
                                                                            variant="label-hidden"
                                                                            value={row.mappedPath}
                                                                            data-index={row.index}
                                                                            placeholder="Add fields to the query first"
                                                                            onchange={handlePdfAcroFormMappingChange}
                                                                        ></lightning-input>
                                                                    </template>
                                                                </td>
                                                                <td>
                                                                    <template if:true={row.isButton}>
                                                                        <lightning-input
                                                                            type="text"
                                                                            variant="label-hidden"
                                                                            value={row.buttonOnValue}
                                                                            data-index={row.index}
                                                                            placeholder="Yes"
                                                                            onchange={handlePdfAcroFormButtonValueChange}
                                                                        ></lightning-input>
                                                                        <template if:true={row.buttonOnValuesText}>
                                                                            <div
                                                                                class="slds-text-body_small slds-text-color_weak"
                                                                            >
                                                                                {row.buttonOnValuesText}
                                                                            </div>
                                                                        </template>
                                                                    </template>
                                                                </td>
                                                            </tr>
                                                        </template>
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    </template>
                                    <template if:false={hasUploadedPdfAcroFormFields}>
                                        <div class="slds-box slds-theme_shade slds-text-align_center">
                                            <lightning-icon icon-name="utility:form" size="small"></lightning-icon>
                                            <h3 class="slds-text-heading_small slds-var-m-top_small">
                                                Fillable Field Mapping
                                            </h3>
                                            <p class="slds-text-body_small slds-text-color_weak slds-var-m-top_x-small">
                                                Upload a PDF template version or load the active snapshot to map fields.
                                            </p>
                                            <lightning-button
                                                class="slds-var-m-top_small"
                                                label="Load Active Mapping"
                                                icon-name="utility:refresh"
                                                onclick={handleReloadPdfAcroFormMapping}
                                            ></lightning-button>
                                        </div>
                                    </template>
                                </div>
                            </lightning-tab>
                        </template>

                        <!-- Tab 4: Document & History -->
                        <lightning-tab label="Document & History" value="document">
                            <div class="slds-var-p-around_small">
                                <!-- Current File Section -->
                                <div
                                    class="slds-box slds-var-m-bottom_large"
                                    style="border-radius: 8px; border: 1px solid #e5e7eb"
                                >
                                    <div
                                        class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-var-m-bottom_medium"
                                    >
                                        <div class="slds-media slds-media_center">
                                            <div class="slds-media__figure">
                                                <lightning-icon icon-name="doctype:word" size="medium"></lightning-icon>
                                            </div>
                                            <div class="slds-media__body">
                                                <h2 class="slds-text-heading_small slds-var-m-bottom_xx-small">
                                                    Current Template File
                                                </h2>
                                                <template if:true={currentFileId}>
                                                    <lightning-badge
                                                        label="Active"
                                                        class="slds-theme_success"
                                                    ></lightning-badge>
                                                    <template if:true={currentVersionLabel}>
                                                        <lightning-badge
                                                            label={currentVersionLabel}
                                                            class="slds-var-m-left_x-small"
                                                        ></lightning-badge>
                                                    </template>
                                                </template>
                                                <template if:false={currentFileId}>
                                                    <p class="slds-text-body_small slds-text-color_weak">
                                                        No file uploaded.
                                                    </p>
                                                </template>
                                            </div>
                                        </div>
                                        <div class="slds-no-flex">
                                            <template if:true={currentFileId}>
                                                <lightning-button
                                                    label="Download Current"
                                                    icon-name="utility:download"
                                                    onclick={downloadTemplate}
                                                ></lightning-button>
                                            </template>
                                        </div>
                                    </div>
                                    <div class="slds-box slds-theme_shade" style="border-radius: 6px">
                                        <template if:false={isEditTypeHtml}>
                                            <template if:true={showEditFileUploadForType}>
                                                <lightning-file-upload
                                                    label="Upload New Version"
                                                    name="fileUploaderEdit"
                                                    accept={acceptedFormats}
                                                    record-id={editTemplateId}
                                                    onuploadfinished={handleEditUploadFinished}
                                                >
                                                </lightning-file-upload>
                                            </template>
                                            <p
                                                class="slds-text-body_small slds-text-color_weak slds-var-m-top_xx-small"
                                            >
                                                Max file size: 10 MB. Larger templates? In Word, right-click any image →
                                                <em>Compress Pictures → Email (96 ppi)</em> — most 20 MB templates drop
                                                to under 2 MB with no visible quality loss.
                                            </p>

                                            <!-- DOCX→HTML transparency: show the exact HTML the PDF engine
                                                 renders from the Word file. Editing it is a one-way ramp to an
                                                 HTML template — the snapshot regenerates on every DOCX upload,
                                                 so in-place edits would be silently clobbered. -->
                                            <template if:true={showDocxConvertedHtmlSection}>
                                                <div class="slds-var-m-top_small">
                                                    <lightning-button
                                                        label={docxHtmlViewerToggleLabel}
                                                        icon-name="utility:preview"
                                                        onclick={toggleDocxHtmlViewer}
                                                    ></lightning-button>
                                                    <template if:true={showDocxHtmlViewer}>
                                                        <div class="slds-var-m-top_small">
                                                            <div class="dg-html-editor-statusbar">
                                                                <span class="dg-html-editor-status"
                                                                    >{docxViewerStatusText}</span
                                                                >
                                                                <lightning-button
                                                                    label="Format Code"
                                                                    icon-name="utility:magicwand"
                                                                    variant="base"
                                                                    data-target="docx"
                                                                    onclick={handleFormatHtml}
                                                                    title="Pretty-print the converted HTML — the converter emits it as one long line."
                                                                    class="slds-var-m-left_small"
                                                                ></lightning-button>
                                                                <lightning-button
                                                                    label={docxHtmlPreviewToggleLabel}
                                                                    icon-name="utility:preview"
                                                                    variant="base"
                                                                    data-target="docx"
                                                                    onclick={handleToggleHtmlPreview}
                                                                    title="Render the converted HTML inline. Merge tags show as-is."
                                                                    class="slds-var-m-left_small"
                                                                ></lightning-button>
                                                            </div>
                                                            <template if:true={isLoadingDocxHtml}>
                                                                <div class="slds-is-relative" style="height: 40px">
                                                                    <lightning-spinner
                                                                        alternative-text="Loading converted HTML"
                                                                        size="small"
                                                                    ></lightning-spinner>
                                                                </div>
                                                            </template>
                                                            <textarea
                                                                class={docxHtmlEditorClass}
                                                                spellcheck="false"
                                                                aria-label="Converted HTML (what the PDF engine renders)"
                                                                placeholder="No conversion snapshot yet — upload a Word file and Save as New Version, then reopen this viewer."
                                                            ></textarea>
                                                            <template if:true={showDocxHtmlPreview}>
                                                                <div
                                                                    class="dg-html-preview-frame dg-docx-preview"
                                                                    lwc:dom="manual"
                                                                    title="Rendered preview of the converted HTML"
                                                                ></div>
                                                            </template>
                                                            <!-- "Switch to HTML Template" removed. A Word template
                                                                 stays a Word template: converting changed its Type
                                                                 and threw away .docx output for good, in exchange for
                                                                 a translation that was never going to be exact. This
                                                                 view stays useful as a way to SEE what the engine
                                                                 renders when diagnosing a Word layout. -->
                                                        </div>
                                                    </template>
                                                </div>
                                            </template>
                                        </template>

                                        <template if:true={isCanvasTemplate}>
                                            <div class="slds-box slds-var-m-top_medium">
                                                <p class="slds-text-body_small slds-var-m-bottom_x-small">
                                                    This is a <b>Canvas</b> template. Its layout is authored on the
                                                    canvas — boxes, tables, images, shapes and codes placed where they
                                                    print.
                                                </p>
                                                <lightning-button
                                                    variant="brand"
                                                    label="Open Canvas Designer"
                                                    icon-name="utility:brush"
                                                    onclick={handleOpenDesignerFromModal}
                                                    title="Full-screen canvas: drag boxes onto the page and see exactly what prints."
                                                ></lightning-button>
                                            </div>
                                        </template>
                                        <template if:true={isEditTypeHtml}>
                                            <label class="slds-form-element__label">Upload New Version</label>
                                            <p class="slds-text-body_small slds-var-m-bottom_x-small">
                                                Accepts <code>.html</code>, <code>.htm</code>, or a Google Docs
                                                "Download → Web Page" <code>.zip</code>. Images are extracted and linked
                                                automatically.
                                            </p>
                                            <input
                                                type="file"
                                                class="docgen-html-file-input"
                                                accept=".html,.htm,.zip"
                                                onchange={handleHtmlFileSelected}
                                                style="display: none"
                                            />
                                            <lightning-button
                                                label="Choose File"
                                                icon-name="utility:upload"
                                                onclick={triggerHtmlFilePicker}
                                                disabled={isUploadingHtml}
                                            >
                                            </lightning-button>
                                            <!-- Legacy, and no longer the brand action. New work goes on
                                                 the canvas; this stays for the HTML templates that already
                                                 exist, because their render path is supported forever even
                                                 though this editor is not where anyone should start. -->
                                            <lightning-button
                                                variant="neutral"
                                                label="Legacy designer"
                                                icon-name="utility:brush"
                                                onclick={handleOpenDesignerFromModal}
                                                title="The older visual designer. New templates are better built on a Canvas."
                                                class="slds-var-m-left_x-small"
                                            >
                                            </lightning-button>
                                            <lightning-button
                                                label="Copy AI Prompt"
                                                icon-name="utility:copy"
                                                onclick={handleCopyEditAiPrompt}
                                                title="Copies a ready-to-paste prompt (your fields + Portwood tag syntax + PDF layout rules) for Claude / ChatGPT / Gemini / Copilot. Paste the returned HTML into the designer."
                                                class="slds-var-m-left_x-small"
                                            >
                                            </lightning-button>
                                            <template if:true={isUploadingHtml}>
                                                <lightning-spinner
                                                    alternative-text="Uploading"
                                                    size="small"
                                                    class="slds-var-m-left_small"
                                                ></lightning-spinner>
                                            </template>
                                        </template>

                                        <template if:true={stagedBodyFileName}>
                                            <div
                                                class="slds-box slds-box_x-small slds-theme_success slds-var-m-top_medium"
                                            >
                                                <lightning-icon
                                                    icon-name="utility:check"
                                                    size="x-small"
                                                    class="slds-var-m-right_small"
                                                    variant="inverse"
                                                ></lightning-icon>
                                                <strong>Ready to Save:</strong> {stagedBodyFileName}
                                            </div>
                                        </template>

                                        <!-- #272 fidelity report. Warnings, never blockers: the body
                                             was already stored when these were produced, so the heading
                                             says what will happen, not what failed. -->
                                        <template if:true={hasLintFindings}>
                                            <div class="slds-box slds-var-m-top_medium">
                                                <h3 class="slds-text-heading_small slds-var-m-bottom_x-small">
                                                    Template warnings — this will still render
                                                </h3>
                                                <p
                                                    class="slds-text-body_small slds-text-color_weak slds-var-m-bottom_small"
                                                >
                                                    Nothing was blocked and your file was saved as-is. The PDF engine is
                                                    CSS 2.1, so at render time it handles the items below differently
                                                    than a browser would — here's what changes.
                                                </p>
                                                <template for:each={lintFindings} for:item="f">
                                                    <div key={f.key} class="slds-var-m-bottom_x-small">
                                                        <lightning-badge label={f.badge} class={f.badgeClass}>
                                                        </lightning-badge>
                                                        <strong class="slds-var-m-left_x-small">{f.rule}</strong>
                                                        <span class="slds-text-body_small slds-text-color_weak">
                                                            &times;{f.occurrences}</span
                                                        >
                                                        <p class="slds-text-body_small slds-var-m-left_medium">
                                                            {f.detail}
                                                        </p>
                                                    </div>
                                                </template>
                                            </div>
                                        </template>

                                        <template if:true={hasUploadedPdfAcroFormFields}>
                                            <div
                                                class="slds-box slds-box_x-small slds-theme_info slds-var-m-top_medium"
                                            >
                                                <lightning-icon
                                                    icon-name="utility:form"
                                                    size="x-small"
                                                    class="slds-var-m-right_small"
                                                    variant="inverse"
                                                ></lightning-icon>
                                                {pdfAcroFormFieldCount} fillable field mappings are ready on the
                                                <strong>Fillable Fields</strong> tab.
                                            </div>
                                        </template>

                                        <p class="slds-text-body_small slds-var-m-top_medium slds-text-color_weak">
                                            <strong>Note:</strong> Uploading attaches the file. You must click
                                            <strong>"Save as New Version"</strong> below to create a new snapshot.
                                        </p>
                                    </div>
                                </div>

                                <!-- Version History -->
                                <div>
                                    <h3 class="slds-text-heading_small slds-var-m-bottom_medium">Version History</h3>

                                    <template if:false={hasVersions}>
                                        <div
                                            class="slds-text-color_weak slds-var-p-around_large slds-text-align_center slds-box slds-theme_shade"
                                            style="border-radius: 8px"
                                        >
                                            <p>No versions available yet.</p>
                                            <p class="slds-text-body_small">Upload a file and save to create v1.</p>
                                        </div>
                                    </template>

                                    <template if:true={hasVersions}>
                                        <div class="table-container" style="max-height: 300px; overflow-y: auto">
                                            <lightning-datatable
                                                key-field="Id"
                                                data={versions}
                                                columns={versionColumns}
                                                onrowaction={handleRestoreVersion}
                                                column-widths-mode="auto"
                                                hide-checkbox-column
                                            >
                                            </lightning-datatable>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </lightning-tab>
                    </lightning-tabset>
                </div>
                <footer class="slds-modal__footer slds-theme_default">
                    <div class="slds-grid slds-grid_align-end">
                        <div class="slds-col">
                            <lightning-button
                                variant="neutral"
                                label="Close"
                                onclick={handleCloseEditModal}
                            ></lightning-button>
                            <lightning-button
                                variant="brand"
                                label="Save as New Version"
                                onclick={handleSaveAndClose}
                                class="slds-var-m-left_small"
                            ></lightning-button>
                        </div>
                    </div>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <!-- Preview Modal -->
    <template if:true={isPreviewModalOpen}>
        <section
            role="dialog"
            tabindex="-1"
            aria-modal="true"
            aria-labelledby="preview-modal-title"
            onkeydown={handlePreviewModalKeydown}
            class="slds-modal slds-fade-in-open slds-modal_medium"
        >
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <lightning-button-icon
                        icon-name="utility:close"
                        alternative-text="Close"
                        title="Close"
                        variant="bare"
                        class="slds-button slds-button_icon slds-modal__close"
                        onclick={closePreviewModal}
                    ></lightning-button-icon>
                    <h2 id="preview-modal-title" class="slds-text-heading_medium">
                        Version Preview: {previewVersion.VersionNumber}
                    </h2>
                </header>
                <div class="slds-modal__content slds-var-p-around_large">
                    <div class="slds-grid slds-gutters slds-var-m-bottom_large">
                        <div class="slds-col slds-size_1-of-3">
                            <p class="slds-text-body_small slds-text-color_weak">Created</p>
                            <p>
                                <lightning-formatted-date-time
                                    value={previewVersion.CreatedDate}
                                    year="numeric"
                                    month="short"
                                    day="numeric"
                                    hour="2-digit"
                                    minute="2-digit"
                                ></lightning-formatted-date-time>
                            </p>
                        </div>
                        <div class="slds-col slds-size_1-of-3">
                            <p class="slds-text-body_small slds-text-color_weak">Created By</p>
                            <p>{previewVersion.CreatedByName}</p>
                        </div>
                        <div class="slds-col slds-size_1-of-3">
                            <p class="slds-text-body_small slds-text-color_weak">Status</p>
                            <p>
                                <template if:true={isPreviewVersionActive}>
                                    <lightning-badge label="Active" class="slds-theme_success"></lightning-badge>
                                </template>
                                <template if:false={isPreviewVersionActive}>
                                    <lightning-badge label="Inactive"></lightning-badge>
                                </template>
                            </p>
                        </div>
                    </div>

                    <div class="slds-box slds-var-m-bottom_large" style="border-radius: 8px">
                        <h3 class="slds-text-heading_small slds-var-m-bottom_medium">Query Configuration</h3>
                        <template if:true={hasPreviewVersionQuery}>
                            <pre
                                class="slds-var-p-around_medium slds-theme_shade"
                                style="
                                    white-space: pre-wrap;
                                    word-break: break-word;
                                    font-size: 0.85rem;
                                    border-radius: 6px;
                                "
                            >
{previewVersionQueryFormatted}</pre
                            >
                        </template>
                        <template if:false={hasPreviewVersionQuery}>
                            <p class="slds-text-color_weak">No query configuration saved.</p>
                        </template>
                    </div>

                    <div class="slds-box slds-theme_shade" style="border-radius: 8px">
                        <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                            <div>
                                <h3 class="slds-text-heading_small">Generate Sample</h3>
                                <p class="slds-text-body_small slds-text-color_weak">
                                    Test this version using the selected sample record.
                                </p>
                            </div>
                            <lightning-button
                                label="Generate"
                                icon-name="utility:page"
                                variant="brand"
                                onclick={handlePreviewGenerate}
                                disabled={previewGenerateDisabled}
                            ></lightning-button>
                        </div>
                        <template if:true={isGeneratingPreview}>
                            <div class="slds-var-m-top_medium slds-is-relative" style="height: 40px">
                                <lightning-spinner alternative-text="Generating..." size="small"></lightning-spinner>
                            </div>
                        </template>
                    </div>
                </div>
                <footer class="slds-modal__footer slds-theme_default">
                    <lightning-button
                        label="Close"
                        onclick={closePreviewModal}
                        class="slds-var-m-right_small"
                    ></lightning-button>
                    <lightning-button
                        label="Activate This Version"
                        variant="brand"
                        onclick={handleRestoreFromPreview}
                        disabled={isPreviewVersionActive}
                    ></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <!-- Generate with Agentforce -->
    <template if:true={isAgentforcePanelOpen}>
        <section
            role="dialog"
            tabindex="-1"
            aria-modal="true"
            aria-labelledby="agentforce-modal-title"
            class="slds-modal slds-fade-in-open slds-modal_medium"
        >
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <lightning-button-icon
                        icon-name="utility:close"
                        alternative-text="Close"
                        title="Close"
                        variant="bare"
                        class="slds-button slds-button_icon slds-modal__close"
                        onclick={handleCloseAgentforcePanel}
                    ></lightning-button-icon>
                    <h2 id="agentforce-modal-title" class="slds-text-heading_medium">Generate with Agentforce</h2>
                </header>
                <div class="slds-modal__content slds-var-p-around_large">
                    <p class="slds-text-body_small slds-text-color_weak slds-var-m-bottom_medium">
                        Your fields, the Portwood tag syntax and the PDF engine's layout rules are sent automatically —
                        the same prompt as <strong>Copy AI Prompt</strong>. Just describe what you want.
                    </p>

                    <template if:true={canEditWithAgentforce}>
                        <lightning-radio-group
                            name="agentforceMode"
                            label="What should Agentforce do?"
                            options={agentforceModeOptions}
                            value={agentforceMode}
                            onchange={handleAgentforceModeChange}
                            type="radio"
                            class="slds-var-m-bottom_medium"
                        ></lightning-radio-group>
                        <template if:true={isAgentforceEditMode}>
                            <p class="slds-text-body_small slds-text-color_weak slds-var-m-bottom_medium">
                                The template currently on the canvas is sent along with your instruction, including any
                                unsaved edits, so nothing is lost. Agentforce revises it rather than starting again.
                            </p>
                        </template>
                    </template>

                    <lightning-textarea
                        label={agentforceDescriptionLabel}
                        value={aiDocDescription}
                        onchange={handleAiDocDescriptionChange}
                        oninput={handleAiDocDescriptionChange}
                        placeholder={agentforceDescriptionPlaceholder}
                        class="dg-af-desc slds-var-m-bottom_medium"
                    ></lightning-textarea>

                    <template if:true={agentforceNeedsDiscardConfirm}>
                        <div class="slds-box slds-theme_warning slds-var-m-bottom_medium">
                            <lightning-input
                                type="checkbox"
                                label="Yes, replace the template currently on the canvas"
                                checked={agentforceConfirmDiscard}
                                onchange={handleAgentforceConfirmDiscardChange}
                            ></lightning-input>
                            <p class="slds-text-body_small slds-var-m-top_x-small">
                                Starting over discards what is on the canvas, unsaved edits included. Previous saved
                                bodies stay in the template's file history, but anything not yet applied is gone.
                            </p>
                        </div>
                    </template>

                    <template if:true={isAgentforceGenerating}>
                        <div class="slds-is-relative slds-var-m-vertical_large" style="height: 60px">
                            <lightning-spinner alternative-text="Generating..." size="small"></lightning-spinner>
                            <p
                                class="slds-text-align_center slds-text-body_small slds-text-color_weak"
                                style="padding-top: 42px"
                            >
                                Working on the template — this usually takes 10&ndash;20 seconds.
                            </p>
                        </div>
                    </template>

                    <template if:true={hasAgentforceReport}>
                        <div class="slds-box slds-var-m-top_medium">
                            <h3 class="slds-text-heading_small slds-var-m-bottom_x-small">{agentforceSummary}</h3>
                            <p class="slds-text-body_small slds-text-color_weak slds-var-m-bottom_small">
                                The PDF engine is CSS 2.1. Anything it ignores was removed or rewritten before the
                                template was saved &mdash; here is exactly what changed.
                            </p>
                            <template for:each={agentforceFindings} for:item="f">
                                <div key={f.key} class="slds-var-m-bottom_x-small">
                                    <lightning-badge label={f.badge} class={f.badgeClass}></lightning-badge>
                                    <strong class="slds-var-m-left_x-small">{f.rule}</strong>
                                    <span class="slds-text-body_small slds-text-color_weak">
                                        &times;{f.occurrences}</span
                                    >
                                    <p class="slds-text-body_small slds-var-m-left_medium">{f.detail}</p>
                                </div>
                            </template>
                        </div>
                    </template>
                </div>
                <footer class="slds-modal__footer slds-theme_default">
                    <lightning-button
                        label="Close"
                        onclick={handleCloseAgentforcePanel}
                        class="slds-var-m-right_small"
                    ></lightning-button>
                    <lightning-button
                        label={agentforceGenerateLabel}
                        variant="brand"
                        onclick={handleGenerateWithAgentforce}
                        disabled={isAgentforceGenerating}
                    ></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
