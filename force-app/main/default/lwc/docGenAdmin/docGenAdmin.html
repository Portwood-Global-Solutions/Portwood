                                >
                                </c-doc-gen-tree-builder>
                            </template>

                            <!-- Manual Query Textarea (hidden when visual builder OR Apex provider is active) -->
                            <template if:false={useVisualBuilder}>
                                <template if:false={useApexProvider}>
                                    <div style="position: relative">
                                        <textarea
                                            class="slds-textarea wizard-query-textarea"
                                            value={newTemplateQuery}
                                            oninput={handleDirectQueryEdit}
                                            onkeydown={handleQueryKeyDown}
                                            placeholder="Paste a SOQL query or type field names — suggestions will appear.&#10;&#10;Examples:&#10;  SELECT Name, Industry, (SELECT FirstName FROM Contacts) FROM Account&#10;  Name, Industry, Phone&#10;  Owner.Name, CreatedBy.Email&#10;  (SELECT FirstName, LastName FROM Contacts)"
                                            style="
                                                width: 100%;
                                                min-height: 240px;
                                                font-family: 'SF Mono', Monaco, Consolas, monospace;
                                                font-size: 0.9rem;
                                                line-height: 1.8;
                                                padding: 14px;
                                                border: 1px solid #d8dde6;
                                                border-radius: 8px;
                                                resize: vertical;
                                            "
                                        >
                                        </textarea>
                                        <template if:true={showSuggestions}>
                                            <div
                                                class="slds-is-absolute dg-merge-suggestions"
                                                onmousedown={handleSuggestionMouseDown}
                                            >
                                                <template for:each={suggestions} for:item="s">
                                                    <div
                                                        key={s.value}
                                                        class="slash-item"
                                                        data-value={s.value}
                                                        onclick={handleSuggestionClick}
                                                        style="
                                                            padding: 6px 12px;
                                                            cursor: pointer;
                                                            display: flex;
                                                            align-items: baseline;
                                                            gap: 8px;
                                                        "
                                                    >
                                                        <span
                                                            style="
                                                                font-family: monospace;
                                                                font-size: 0.85rem;
                                                                color: #7c3aed;
                                                                font-weight: 600;
                                                            "
                                                            >{s.value}</span
                                                        >
                                                        <span style="font-size: 0.78rem; color: #706e6b"
                                                            >{s.label}</span
                                                        >
                                                        <template if:true={s.extra}>
                                                            <span
                                                                style="
                                                                    font-size: 0.68rem;
                                                                    color: #999;
                                                                    margin-left: auto;
                                                                "
                                                                >{s.extra}</span
                                                            >
                                                        </template>
                                                    </div>
                                                </template>
                                            </div>
                                        </template>
                                    </div>
                                </template>
                            </template>
                            <template if:false={useApexProvider}>
                                <template if:true={queryWarnings}>
                                    <template for:each={queryWarnings} for:item="warn">
                                        <div
                                            key={warn}
                                            style="
                                                margin-top: 8px;
                                                padding: 8px 12px;
                                                background: #fff8e1;
                                                border: 1px solid #f9a825;
                                                border-radius: 6px;
                                                font-size: 0.8rem;
                                                color: #5d4037;
                                                display: flex;
                                                align-items: center;
                                                gap: 6px;
                                            "
                                        >
                                            <lightning-icon
                                                icon-name="utility:warning"
                                                size="xx-small"
                                                variant="warning"
                                            ></lightning-icon>
                                            {warn}
                                        </div>
                                    </template>
                                </template>
                            </template>
                            <template if:false={useApexProvider}>
                                <template if:true={queryTreeNodes.length}>
                                    <div
                                        style="
                                            margin-top: 12px;
                                            border: 1px solid #e5e5e5;
                                            border-radius: 8px;
                                            padding: 10px 14px;
                                            background: #fafaf9;
                                        "
                                    >
                                        <template for:each={queryTreeNodes} for:item="node">
                                            <div key={node.id}>
                                                <div
                                                    style="
                                                        display: flex;
                                                        align-items: center;
                                                        gap: 4px;
                                                        margin-bottom: 6px;
                                                    "
                                                >
                                                    <lightning-icon
                                                        icon-name="standard:account"
                                                        size="xx-small"
                                                    ></lightning-icon>
                                                    <span style="font-weight: 700; font-size: 0.85rem"
                                                        >{node.label}</span
                                                    >
                                                </div>
                                                <!-- Fields with sample values -->
                                                <template if:true={node.hasFields}>
                                                    <div
                                                        style="
                                                            margin-left: 22px;
                                                            display: flex;
                                                            flex-wrap: wrap;
                                                            gap: 4px;
                                                            margin-bottom: 6px;
                                                        "
                                                    >
                                                        <template for:each={node.fieldPills} for:item="fp">
                                                            <span
                                                                key={fp.key}
                                                                style="
                                                                    background: #eef4ff;
                                                                    border: 1px solid #c7d7f5;
                                                                    padding: 2px 8px;
                                                                    border-radius: 4px;
                                                                    font-size: 0.75rem;
                                                                    font-family: monospace;
                                                                    display: inline-flex;
                                                                    align-items: baseline;
                                                                    gap: 4px;
                                                                "
                                                            >
                                                                <span style="color: #1a56db">{fp.name}</span>
                                                                <template if:true={fp.sample}>
                                                                    <span
                                                                        style="
                                                                            color: #555;
                                                                            font-family: -apple-system, sans-serif;
                                                                            font-weight: 400;
                                                                        "
                                                                        >= {fp.sample}</span
                                                                    >
                                                                </template>
                                                            </span>
                                                        </template>
                                                    </div>
                                                </template>
                                                <!-- Parent fields with sample values -->
                                                <template if:true={node.hasParentFields}>
                                                    <div
                                                        style="
                                                            margin-left: 22px;
                                                            display: flex;
                                                            flex-wrap: wrap;
                                                            gap: 4px;
                                                            margin-bottom: 6px;
                                                        "
                                                    >
                                                        <template for:each={node.parentPills} for:item="pp">
                                                            <span
                                                                key={pp.key}
                                                                style="
                                                                    background: #f3e8ff;
                                                                    border: 1px solid #d8c4f0;
                                                                    padding: 2px 8px;
                                                                    border-radius: 4px;
                                                                    font-size: 0.75rem;
                                                                    font-family: monospace;
                                                                    display: inline-flex;
                                                                    align-items: baseline;
                                                                    gap: 4px;
                                                                "
                                                            >
                                                                <span style="color: #7c3aed">{pp.name}</span>
                                                                <template if:true={pp.sample}>
                                                                    <span
                                                                        style="
                                                                            color: #555;
                                                                            font-family: -apple-system, sans-serif;
                                                                            font-weight: 400;
                                                                        "
                                                                        >= {pp.sample}</span
                                                                    >
                                                                </template>
                                                            </span>
                                                        </template>
                                                    </div>
                                                </template>
                                                <!-- Child relationships (flattened for any depth) -->
                                                <template if:true={node.hasFlatChildren}>
                                                    <div style="margin-left: 22px">
                                                        <template for:each={node.flatChildren} for:item="child">
                                                            <div key={child.id} style={child.indentStyle}>
                                                                <div
                                                                    style="
                                                                        display: flex;
                                                                        align-items: center;
                                                                        gap: 4px;
                                                                        margin-bottom: 4px;
                                                                    "
                                                                >
                                                                    <lightning-icon
                                                                        icon-name="standard:related_list"
                                                                        size="xx-small"
                                                                    ></lightning-icon>
                                                                    <span style="font-weight: 600; font-size: 0.82rem"
                                                                        >{child.label}</span
                                                                    >
                                                                    <span
                                                                        style="
                                                                            font-size: 0.72rem;
                                                                            color: #706e6b;
                                                                            margin-left: 4px;
                                                                        "
                                                                        >({child.fieldCount} fields)</span
                                                                    >
                                                                </div>
                                                                <div
                                                                    style="
                                                                        margin-left: 20px;
                                                                        display: flex;
                                                                        flex-wrap: wrap;
                                                                        gap: 3px;
                                                                    "
                                                                >
                                                                    <template for:each={child.fields} for:item="cf">
                                                                        <span
                                                                            key={cf}
                                                                            style="
                                                                                background: #ecfdf5;
                                                                                color: #065f46;
                                                                                padding: 2px 8px;
                                                                                border-radius: 4px;
                                                                                font-size: 0.75rem;
                                                                                font-family: monospace;
                                                                            "
                                                                            >{cf}</span
                                                                        >
                                                                    </template>
                                                                    <template if:true={child.hasParentFields}>
                                                                        <template
                                                                            for:each={child.parentFields}
                                                                            for:item="pf"
                                                                        >
                                                                            <span
                                                                                key={pf}
                                                                                style="
                                                                                    background: #f3e8ff;
                                                                                    color: #7c3aed;
                                                                                    border: 1px solid #d8c4f0;
                                                                                    padding: 2px 8px;
                                                                                    border-radius: 4px;
                                                                                    font-size: 0.75rem;
                                                                                    font-family: monospace;
                                                                                "
                                                                                >{pf}</span
                                                                            >
                                                                        </template>
                                                                    </template>
                                                                </div>
                                                            </div>
                                                        </template>
                                                    </div>
                                                </template>
                                            </div>
                                        </template>
                                    </div>
                                </template>
                            </template>

                            <!-- Inline Help — SOQL reference (hidden when Apex Provider is the data source) -->
                            <template if:false={useApexProvider}>
                                <div
                                    style="
                                        margin-top: 14px;
                                        background: #f8fafc;
                                        border: 1px solid #e5e5e5;
                                        border-radius: 8px;
                                        padding: 12px 16px;
                                        font-size: 0.8rem;
                                        color: #444;
                                        line-height: 1.7;
                                    "
                                >
                                    <div style="font-weight: 700; color: #181818; margin-bottom: 6px">
                                        Quick Reference
                                    </div>
                                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 4px 24px">
                                        <div>
                                            <strong>Fields:</strong>
                                            <code style="background: #eee; padding: 1px 4px; border-radius: 3px"
                                                >Name, Industry, Phone</code
                                            >
                                        </div>
                                        <div>
                                            <strong>Parent lookup:</strong>
                                            <code style="background: #eee; padding: 1px 4px; border-radius: 3px"
                                                >Owner.Name, Account.Industry</code
                                            >
                                        </div>
                                        <div>
                                            <strong>Related list:</strong>
                                            <code style="background: #eee; padding: 1px 4px; border-radius: 3px"
                                                >(SELECT FirstName FROM Contacts)</code
                                            >
                                        </div>
                                        <div>
                                            <strong>With filter:</strong>
                                            <code style="background: #eee; padding: 1px 4px; border-radius: 3px"
                                                >(SELECT Name FROM Opps WHERE StageName = 'Closed Won')</code
                                            >
                                        </div>
                                        <div>
                                            <strong>With sort:</strong>
                                            <code style="background: #eee; padding: 1px 4px; border-radius: 3px"
                                                >(SELECT Name FROM Contacts ORDER BY LastName)</code
                                            >
                                        </div>
                                        <div>
                                            <strong>With limit:</strong>
                                            <code style="background: #eee; padding: 1px 4px; border-radius: 3px"
                                                >(SELECT Name FROM Cases LIMIT 10)</code
                                            >
                                        </div>
                                    </div>
                                </div>
                            </template>
                        </template>

                        <!-- Step 3: Review & Create -->
                        <template if:true={isStep3}>
                            <div class="slds-box slds-theme_shade" style="border-radius: 8px">
                                <h3 class="slds-text-heading_medium slds-var-m-bottom_medium">Review Template</h3>
                                <p class="slds-var-m-bottom_small"><strong>Name:</strong> {newTemplateName}</p>
                                <template if:true={newTemplateApiName}>
                                    <p class="slds-var-m-bottom_small">
                                        <strong>API Name:</strong> <code>{newTemplateApiName}</code>
                                    </p>
                                </template>
                                <template if:true={isFlowDataSource}>
                                    <p class="slds-var-m-bottom_small">
                                        <strong>Data Source:</strong> JSON Data (from Flow)
                                    </p>
                                    <p class="slds-var-m-bottom_small slds-text-body_small slds-text-color_weak">
                                        Data is supplied at runtime via
                                        <code>DocGenFlowAction.jsonData</code>. No SOQL or Apex Provider class is bound
                                        to this template.
                                    </p>
                                </template>
                                <template if:false={isFlowDataSource}>
                                    <p class="slds-var-m-bottom_small"><strong>Object:</strong> {newTemplateObject}</p>
                                    <p class="slds-var-m-bottom_small"><strong>Query:</strong></p>
                                    <pre
                                        style="
                                            font-size: 0.8125rem;
                                            background: #f3f2f2;
                                            padding: 0.75rem;
                                            border-radius: 6px;
                                            white-space: pre-wrap;
                                            margin: 0 0 0.5rem 0;
                                        "
                                    >
{readableQueryConfig}</pre
                                    >
                                </template>
                                <template if:true={isAuthoringStarter}>
                                    <p class="slds-var-m-bottom_small">
                                        <strong>Starter design:</strong> {selectedStarterLabel} — a ready-to-render HTML
                                        body with your merge fields is attached on create. Review it in the editor, then
                                        click "Save as New Version" to activate v1.
                                    </p>
                                </template>
                                <template if:true={isAuthoringAi}>
                                    <div class="slds-var-m-top_medium">
                                        <div
                                            style="
                                                display: flex;
                                                align-items: center;
                                                justify-content: space-between;
                                                margin-bottom: 6px;
                                            "
                                        >
                                            <strong
                                                >Your AI prompt — copy this into Claude, ChatGPT, Gemini, or
                                                Copilot</strong
                                            >
                                            <lightning-button
                                                label="Copy Prompt"
                                                icon-name="utility:copy"
                                                variant="brand"
                                                onclick={handleCopyAiPrompt}
                                            ></lightning-button>
                                        </div>
                                        <pre class="dg-ai-prompt">{aiAuthoringPrompt}</pre>
                                        <p class="slds-text-body_small slds-text-color_weak slds-var-m-top_x-small">
                                            Paste the HTML your assistant returns into the template's&nbsp;<strong
                                                >Edit HTML</strong
                                            >&nbsp;editor (it opens after Create). The prompt stays available there too.
                                        </p>
                                    </div>
                                </template>
                                <p class="slds-var-m-top_large">Click "Create Template" to save.</p>
                            </div>
                        </template>
                    </div>

                    <!-- Footer Navigation -->
                    <div class="wizard-footer">
                        <div class="slds-float_right">
                            <lightning-button
                                label="Back"
                                onclick={handlePrevStep}
                                disabled={isBackDisabled}
                                class="slds-var-m-right_small"
                            >
                            </lightning-button>

                            <template if:false={hideWizardFooterNext}>
                                <lightning-button label="Next" variant="brand" onclick={handleNextStep}>
                                </lightning-button>
                            </template>
                            <template if:true={isStep3}>
                                <lightning-button label="Create Template" variant="success" onclick={createTemplate}>
                                </lightning-button>
                            </template>
                        </div>
                    </div>
                </div>
            </lightning-tab>

            <lightning-tab label="Your Templates" value="list" onactive={handleTabActive}>
                <div class="slds-var-p-around_large">
                    <div class="slds-grid slds-grid_vertical-align-end slds-var-m-bottom_large">
                        <div class="slds-col slds-size_1-of-3">
                            <lightning-input
                                type="search"
                                label="Search Templates"
                                placeholder="Search by Name, Category, or Object..."
                                value={searchKey}
                                onchange={handleSearch}
                            >
                            </lightning-input>
                        </div>
                        <div class="slds-col slds-var-p-left_medium">
                            <lightning-button
                                icon-name="utility:refresh"
                                onclick={handleRefresh}
                                label="Refresh"
                                title="Refresh Templates"
                                variant="neutral"
                            >
                            </lightning-button>
                        </div>
                        <div class="slds-col slds-var-p-left_medium">
                            <lightning-button
                                icon-name="utility:add"
                                onclick={handleGoToCreate}
                                label="New Template"
                                title="Create a new template"
                                variant="brand"
                                class="slds-var-m-right_small"
                            >
                            </lightning-button>
                            <lightning-button
                                icon-name="utility:upload"
                                onclick={handleImportClick}
                                label="Import Template"
                                title="Import a .docgen.json template file"
                                variant="neutral"
                            >
                            </lightning-button>
                            <input
                                type="file"
                                data-id="importFileInput"
                                accept=".json"
                                style="display: none"
                                onchange={handleImportFile}
                            />
                        </div>
                    </div>
                    <template if:true={isInstallingSamples}>
                        <div class="slds-var-p-around_xx-large slds-text-align_center">
                            <lightning-spinner
                                alternative-text="Installing sample templates..."
                                size="medium"
                            ></lightning-spinner>
                            <p class="slds-var-m-top_large slds-text-heading_small">Installing sample templates...</p>
                            <p class="slds-text-body_small slds-text-color_weak slds-var-m-top_small">
                                Creating 5 templates with DOCX files and query configs
                            </p>
                        </div>
                    </template>
                    <template if:false={isInstallingSamples}>
                        <template if:true={hasNoTemplates}>
                            <div class="slds-box slds-theme_shade slds-text-align_center slds-var-m-bottom_medium">
                                <p class="slds-text-heading_small slds-var-m-bottom_x-small">
                                    Start with your first template
                                </p>
                                <p class="slds-text-body_small slds-text-color_weak slds-var-m-bottom_small">
                                    Pick a professional starter design and generate a real PDF on the first click.
                                </p>
                                <lightning-button
                                    label="Create a Template"
                                    variant="brand"
                                    onclick={handleGoToCreate}
                                ></lightning-button>
                            </div>
                        </template>
                        <p class="slds-text-body_small slds-text-color_weak slds-var-m-bottom_x-small">
                            {templateCountLabel}
                        </p>
                        <div class="table-container">
                            <lightning-datatable
                                key-field="Id"
                                data={filteredTemplates}
                                columns={columns}
                                onrowaction={handleRowAction}
                                sorted-by={templateSortedBy}
                                sorted-direction={templateSortedDirection}
                                onsort={handleTemplateSort}
                                min-column-width="70"
                                hide-checkbox-column
                            >
                            </lightning-datatable>
                        </div>
                    </template>
                </div>
            </lightning-tab>

            <!-- Full-screen template designer: the page is the canvas, palettes ride the rail -->
            <lightning-tab label="Designer (Beta)" value="design" onactive={handleTabActive}>
                <div class="slds-var-p-around_medium">
                    <!-- Landing on the Designer with nothing open used to be a dead
                         end: it named two other tabs and left you to go there. The
                         tab is where you come to design, so the templates you can
                         design are here, one click each. -->
                    <template if:false={designerHasTemplate}>
                        <div class="dg-designer-empty">
                            <lightning-icon icon-name="utility:brush" size="medium"></lightning-icon>
                            <p class="dg-designer-empty__title">Choose a template to design</p>
                            <template if:true={hasDesignerTemplates}>
                                <p class="dg-designer-empty__hint">
                                    HTML templates can be edited visually — most recently edited first.
                                </p>
                                <!-- Searched, recency-ordered and CAPPED. A flat list of
                                     every template is unusable in an org with hundreds, and
                                     renders hundreds of nodes on a tab you have not started
                                     working on yet. This DOM is the same size at 5 templates
                                     or 5000. -->
                                <div class="dg-designer-open-search">
                                    <lightning-icon icon-name="utility:search" size="x-small"></lightning-icon>
                                    <input
                                        type="text"
                                        class="dg-designer-open-search__input"
                                        placeholder="Search by name, category or object…"
                                        value={designerPickerQuery}
                                        oninput={handleDesignerPickerSearch}
                                        onkeydown={handleDesignerPickerKeydown}
                                    />
                                </div>
                                <div class="dg-designer-open-list">
                                    <template for:each={designerOpenList} for:item="opt">
                                        <button
                                            key={opt.value}
                                            class="dg-designer-open-item"
                                            data-id={opt.value}
                                            onclick={handleOpenTemplateInDesigner}
                                            title="Open this template in the designer"
                                        >
                                            <lightning-icon icon-name="utility:page" size="x-small"></lightning-icon>
                                            <span class="dg-designer-open-item__text">
                                                <span class="dg-designer-open-item__name">{opt.label}</span>
                                                <span class="dg-designer-open-item__meta">{opt.meta}</span>
                                            </span>
                                            <span class="dg-designer-open-item__go">Design &#8594;</span>
                                        </button>
                                    </template>
                                </div>
                                <div class="dg-designer-open-foot">
                                    <span class="dg-designer-open-count">{designerPickerSummary}</span>
                                    <template if:true={designerPickerHasMore}>
                                        <button
                                            class="dg-designer-open-more"
                                            onclick={handleDesignerPickerMore}
                                            title="Show more templates"
                                        >
                                            Show more
                                        </button>
                                    </template>
                                </div>
                            </template>
                            <template if:false={hasDesignerTemplates}>
                                <p class="dg-designer-empty__hint">
                                    Nothing to design yet. Make one from&nbsp;<strong>Create New</strong
                                    >&nbsp;&rarr;&nbsp;<strong>Start from a Blank Canvas</strong>. Word, Excel,
                                    PowerPoint and PDF templates keep their own format and are edited as files rather
                                    than designed here.
                                </p>
                            </template>
                        </div>
                    </template>
                    <template if:true={showCanvasDesignerTab}>
                        <c-doc-gen-canvas
                            template-id={editTemplateId}
                            page-size={editTemplatePageSize}
                            orientation={editTemplatePageOrientation}
                            query-config={editTemplateQuery}
                            base-object={editTemplateObject}
                            sample-record-id={editTemplateTestRecordId}
                            onedittemplate={handleEditTemplateFromDesigner}
                            onqueryupdated={handleCanvasQueryUpdated}
                            onsaved={handleCanvasSaved}
                            onback={handleCanvasBack}
                        ></c-doc-gen-canvas>
                    </template>
                    <template if:true={showFlowDesignerTab}>
                        <div class={designerShellClass}>
                            <div class="dg-designer-toolbar">
                                <div class="dg-designer-toolbar__title">
                                    <lightning-icon icon-name="utility:brush" size="small"></lightning-icon>
                                    <span
                                        class="dg-beta-chip"
                                        title="The visual designer is in beta — rough edge? Report a Bug in the sidebar or email support@portwood.dev."
                                        >BETA</span
                                    >
                                    <div class="dg-designer-template-switch">
                                        <lightning-combobox
                                            variant="label-hidden"
                                            value={editTemplateId}
                                            options={designerTemplateOptions}
                                            onchange={handleDesignerTemplateSwitch}
                                            title="Switch to another HTML template without leaving the designer"
                                        ></lightning-combobox>
                                    </div>
                                </div>
                                <template if:true={isRealObject}>
                                    <div class="dg-designer-toolbar__sample">
                                        <lightning-record-picker
                                            label="Sample Record"
                                            variant="label-hidden"
                                            object-api-name={editTemplateObject}
                                            value={editTemplateTestRecordId}
                                            onchange={handleEditTestRecordChange}
                                            placeholder="Sample record for previews..."
                                        >
                                        </lightning-record-picker>
                                    </div>
                                    <button
                                        class="dg-fmt-btn dg-panel-btn dg-tb-chip"
                                        onclick={handleTestGenerate}
                                        disabled={editGenerateSampleDisabled}
                                        title="Saves settings, renders the ACTIVE version with this sample record, and downloads the file. For unsaved edits use PDF Preview."
                                    >
                                        Download Sample
                                    </button>
                                    <template if:true={isLoadingVersions}>
                                        <lightning-spinner
                                            alternative-text="Working..."
                                            size="small"
                                        ></lightning-spinner>
                                    </template>
                                </template>
                                <div class="dg-designer-toolbar__tools">
                                    <button
                                        class="dg-fmt-btn dg-panel-btn dg-tb-chip"
                                        onclick={handleCopyEditAiPrompt}
                                        title="Ready-to-paste prompt (your fields + tag syntax + PDF layout rules) for Claude / ChatGPT / Gemini / Copilot."
                                    >
                                        Copy AI Prompt
                                    </button>
                                    <template if:true={showAgentforceButton}>
                                        <button
                                            class="dg-fmt-btn dg-panel-btn dg-tb-chip"
                                            onclick={handleOpenAgentforcePanel}
                                            disabled={isAgentforceGenerating}
                                            title="Send the same prompt to Salesforce AI in this org and load the result straight into the canvas — no copy-paste."
                                        >
                                            {agentforceBtnLabel}
                                        </button>
                                    </template>
                                    <button
                                        class="dg-fmt-btn dg-panel-btn dg-pdf-preview-btn dg-toolbar-pdf"
                                        onclick={handlePdfPreview}
                                        disabled={isPdfPreviewLoading}
                                        title="Render the CURRENT DRAFT through the real PDF engine with your sample record — nothing is saved."
                                    >
                                        {pdfPreviewBtnLabel}
                                    </button>
                                    <button
                                        class="dg-fmt-btn dg-panel-btn dg-tb-chip"
                                        data-target="body"
                                        onclick={handleFormatHtml}
                                        disabled={showHtmlBodyVisual}
                                        title="Pretty-print the raw HTML (Source view only)."
                                    >
                                        Format Code
                                    </button>
                                    <button
                                        class="dg-fmt-btn dg-panel-btn dg-tb-chip"
                                        onclick={handleReloadHtmlBodyEditor}
                                        title="Replace the editor with the staged (or saved) body. Discards unapplied edits."
                                    >
                                        Reload
                                    </button>
                                </div>
                                <div class="dg-designer-toolbar__actions">
                                    <lightning-button
                                        variant="brand"
                                        label="Save as New Version"
                                        icon-name="utility:save"
                                        onclick={handleSaveAndClose}
                                    ></lightning-button>
                                    <button
                                        class="dg-fmt-btn dg-panel-btn dg-tb-chip"
                                        onclick={handleEditTemplateFromDesigner}
                                        title="Full settings — query, versions, sharing, signatures."
                                    >
                                        Edit Template
                                    </button>
                                </div>
                            </div>

                            <div class="dg-html-editor-statusbar">
                                <div class="dg-mode-seg" role="tablist" aria-label="Editor mode">
                                    <button
                                        class={visualModeBtnClass}
                                        onclick={handleSelectVisualMode}
                                        title="Edit the document as it renders — click anywhere and type"
                                    >
                                        Visual
                                    </button>
                                    <button
                                        class={sourceModeBtnClass}
                                        onclick={handleSelectSourceMode}
                                        title="Edit the raw HTML with a live full-page preview below"
                                    >
                                        Source
                                    </button>
                                </div>
                                <span class="dg-page-group"
                                    ><span class="dg-fmt-label">Page</span>
                                    <select
                                        class="dg-page-select"
                                        data-field="size"
                                        onchange={handlePageSetupChange}
                                        title="Page size"
                                    >
                                        <option value="Letter">Letter</option>
                                        <option value="Legal">Legal</option>
                                        <option value="A4">A4</option>
                                        <option value="Custom">Custom…</option>
                                    </select>
                                    <template if:false={isCustomPageSize}>
                                        <select
                                            class="dg-page-select"
                                            data-field="orient"
                                            onchange={handlePageSetupChange}
                                            title="Orientation"
                                        >
                                            <option value="portrait">Portrait</option>
                                            <option value="landscape">Landscape</option>
                                        </select>
                                    </template>
                                    <template if:true={isCustomPageSize}>
                                        <input
                                            type="number"
                                            class="dg-page-input"
                                            data-field="customW"
                                            min="1"
                                            max="200"
                                            step="0.25"
                                            onchange={handlePageSetupChange}
                                            title="Page width in inches"
                                        />
                                        <span class="dg-fmt-label">×</span>
                                        <input
                                            type="number"
                                            class="dg-page-input"
                                            data-field="customH"
                                            min="1"
                                            max="200"
                                            step="0.25"
                                            onchange={handlePageSetupChange}
                                            title="Page height in inches"
                                        />
                                        <span class="dg-fmt-label">in</span>
                                    </template>
                                    <select
                                        class="dg-page-select"
                                        data-field="margin"
                                        onchange={handlePageSetupChange}
                                        title="Page margins"
                                    >
                                        <option value="0.5">0.5&quot; margins</option>
                                        <option value="0.75">0.75&quot; margins</option>
                                        <option value="1">1&quot; margins</option>
                                        <option value="custom">Custom…</option>
                                    </select>
                                    <template if:true={isCustomMargin}>
                                        <input
                                            type="number"
                                            class="dg-page-input"
                                            data-field="customMargin"
                                            min="0"
                                            max="10"
                                            step="0.05"
                                            onchange={handlePageSetupChange}
                                            title="Margin in inches"
                                        />
                                        <span class="dg-fmt-label">in</span>
                                    </template>
                                    <span class="dg-fmt-sep"></span> </span
                                ><button
                                    class="dg-fmt-btn dg-panel-btn"
                                    data-panel="insert"
                                    onclick={handlePanelToggle}
                                    title="Insert blocks, sections, tables — searchable. Or just type ` or [ in the page."
                                >
                                    + Insert
                                </button>
                                <button
                                    class="dg-fmt-btn dg-panel-btn"
                                    data-panel="tags"
                                    onclick={handlePanelToggle}
                                    title="Merge tags from your query — searchable"
                                >
                                    &#123;&nbsp;&#125; Tags
                                </button>
                                <button
                                    class="dg-fmt-btn dg-panel-btn"
                                    data-panel="images"
                                    onclick={handlePanelToggle}
                                    title="Upload and place images"
                                >
                                    Images
                                </button>
                                <button
                                    class="dg-fmt-btn dg-panel-btn"
                                    data-panel="query"
                                    onclick={handlePanelToggle}
                                    title="Check a field to add it to this template's query — all fields, no click-hunting"
                                >
                                    Query
                                </button>
                                <button
                                    class="dg-fmt-btn dg-panel-btn"
                                    data-panel="versions"
                                    onclick={handlePanelToggle}
                                    title="Load any previous version's body into the editor"
                                >
                                    Versions
                                </button>
                                <button
                                    class="dg-fmt-btn dg-panel-btn"
                                    data-panel="hf"
                                    onclick={handlePanelToggle}
                                    title="Header and footer that repeat on every PDF page — with page numbers"
                                >
                                    Header/Footer
                                </button>
                                <template if:true={editTemplateOutputIsPdf}>
                                    <button
                                        class="dg-fmt-btn dg-panel-btn"
                                        data-panel="watermark"
                                        onclick={handlePanelToggle}
                                        title="Full-page background image (PDF)"
                                    >
                                        Watermark
                                    </button>
                                </template>
                            </div>
                            <div class="dg-status-strip">
                                <template if:true={selectionContextLabel}>
                                    <span class="dg-context-label">{selectionContextLabel}</span>
                                </template>

                        <div class="dg-designer-layout">
                            <div class="dg-designer-canvas-col">
                                <!-- The insert-table grid picker is rendered HERE, not inside
                                 the format bar. .dg-format-bar is a sticky element with a
                                 z-index, which makes it a STACKING CONTEXT — a popover
                                 inside it is capped at the bar's z-index and was painted
                                 over by the chrome row above (z-40), so the grid's top
                                 rows could not be clicked and a 1-column table was
                                 impossible to pick. It is position: fixed and placed from
                                 its anchor by _positionFloating, so where it lives in the
                                 DOM affects only stacking, never position. -->
                                <template if:true={tableGrid}>
                                    <div class="dg-fmt-menu dg-grid-menu" role="menu">
                                        <div class="dg-grid">
                                            <template for:each={tableGridCells} for:item="g">

                                                    key={g.key}
                                                    class={g.cls}
                                                    data-r={g.r}
                                                    data-c={g.c}
                                                    onmouseenter={handleTableGridHover}
                                                    onmousedown={handleFmtMouseDown}
                                                    onclick={handleTableGridPick}
                                                    title={tableGridLabel}

                                <template if:true={pillMenu}>

                                          rows below, so changing a tag meant opening the menu,
                                          reading the tag, then hunting for a separate command
                                          to change the thing already in front of you.

                                                class="dg-pill-menu-edit"
                                                type="text"
                                                value={pillMenu.tagText}

                                                onchange={handlePillHeadCommit}

                                                &#10005;
                                            </button>
                                        </div>
                                        <template if:true={pillMenu.hasOptions}>
                                            <div class="dg-pill-menu-scroll">
                                                <template for:each={pillMenu.sections} for:item="sec">

                                                        <div class="dg-pill-menu-sec">{sec.label}</div>
                                                        <template for:each={sec.options} for:item="opt">
                                                            <button
                                                                key={opt.key}
                                                                class={opt.cls}
                                                                data-tag={opt.tag}
                                                                onclick={handlePillTransform}
                                                            >

                                                            </button>
                                                        </template>
                                                    </div>
                                                </template>
                                            </div>

                                        <button class="dg-pill-menu-item" onclick={handlePillEdit}>
                                            Edit tag&#8230; (or double-click the pill)
                                        </button>
                                        <button
                                            class="dg-pill-menu-item dg-pill-menu-remove"
                                            onclick={handlePillRemove}
                                        >
                                            Remove from document
                                        </button>
                                    </div>
                                </template>
                                <!-- Notion-style slash-command menu: type "/" in the page -->
                                <template if:true={slashMenu}>
                                    <div class="dg-slash-menu" style={slashMenu.posStyle} role="menu">
                                        <div class="dg-slash-menu-head">
                                            <span>Insert</span>
                                            <button
                                                class="dg-pill-menu-x"
                                                onclick={handleSlashMenuClose}
                                                title="Close (Esc)"
                                            >
                                                &#10005;
                                            </button>
                                        </div>
                                        <!--
                                          The menu owns its own search box now. It used to say
                                          "keep typing to filter" and filter from what you typed
                                          in the PAGE — so the moment you clicked the menu, the
                                          caret left the page and typing did nothing. With no
                                          way to filter and only the first items visible, every
                                          command past the top of the list was unreachable.
                                        -->
                                        <input
                                            type="search"
                                            class="dg-panel-search dg-slash-search"
                                            placeholder="Search commands…"
                                            value={slashMenu.query}
                                            oninput={handleSlashSearch}
                                            onkeydown={handleSlashSearchKeydown}
                                            autocomplete="off"
                                        />
                                        <template if:true={slashMenu.hasItems}>
                                            <template for:each={slashMenu.items} for:item="opt">
                                                <button
                                                    key={opt.key}
                                                    class={opt.itemClass}
                                                    data-key={opt.key}
                                                    onmousedown={handleFmtMouseDown}
                                                    onclick={handleSlashItemClick}
                                                >
                                                    <span class="dg-slash-item-label">{opt.label}</span>
                                                    <span class="dg-slash-item-group">{opt.group}</span>
                                                </button>
                                            </template>
                                        </template>
                                        <template if:false={slashMenu.hasItems}>
                                            <div class="dg-slash-empty">

                                            </div>
                                        </template>
                                        <template if:true={slashMenu.errorMsg}>
                                            <div class="dg-slash-empty">{slashMenu.errorMsg}</div>
                                        </template>
                                        <div class="dg-slash-foot">
                                            Not seeing your field? Edit your query: Edit Template &#8594; Query
                                            Configuration.
                                            <br />
                                            Think this should be a command?
                                            <a
                                                href="mailto:hello@portwood.dev?subject=Portwood%20designer%20command%20idea"
                                                >Email hello@portwood.dev</a
                                            >
                                        </div>
                                    </div>
                                </template>
                                <!-- Right-click context menu -->
                                <template if:true={ctxMenu}>

                                                    key={opt.key}

                                                    data-key={opt.key}
                                                    onclick={handleCtxSearchedItemClick}
                                                >
                                                    <span class="dg-slash-item-label">{opt.label}</span>
                                                    <span class="dg-slash-item-group">{opt.group}</span>
                                                </button>
                                            </template>

                                        <template if:false={ctxMenu.items}>
                                            <button class="dg-slash-item" onclick={handleCtxInsert}>
                                                <span class="dg-slash-item-label">Insert&#8230;</span>
                                                <span class="dg-slash-item-group">blocks &amp; tags</span>
                                            </button>
                                            <button
                                                class="dg-slash-item"
                                                data-cmd="bold"
                                                onmousedown={handleFmtMouseDown}
                                                onclick={handleCtxFormat}
                                            >
                                                <span class="dg-slash-item-label"><b>Bold</b></span>
                                            </button>
                                            <button
                                                class="dg-slash-item"
                                                data-cmd="italic"
                                                onmousedown={handleFmtMouseDown}
                                                onclick={handleCtxFormat}

                                                <span class="dg-slash-item-label">&#8226; Bulleted list</span>
                                            </button>
                                            <button
                                                class="dg-slash-item"
                                                data-kind="ol"
                                                onmousedown={handleFmtMouseDown}
                                                onclick={handleCtxList}
                                            >
                                                <span class="dg-slash-item-label">1. Numbered list</span>
                                            </button>
                                            <template if:true={ctxMenu.inTable}>
                                                <div class="dg-slash-menu-head"><span>Table</span></div>

                                                    class="dg-slash-item"
                                                    data-taction="rowBefore"
                                                    onmousedown={handleFmtMouseDown}
                                                    onclick={handleCtxTable}
                                                >
                                                    <span class="dg-slash-item-label">+ Row above</span>

                                                    class="dg-slash-item"
                                                    data-taction="rowAfter"

                                                    <span class="dg-slash-item-label">+ Row below</span>
                                                </button>
                                                <button
                                                    class="dg-slash-item"
                                                    data-taction="colBefore"
                                                    onmousedown={handleFmtMouseDown}
                                                    onclick={handleCtxTable}
                                                >
                                                    <span class="dg-slash-item-label">+ Column left</span>
                                                </button>
                                                <button
                                                    class="dg-slash-item"
                                                    data-taction="colAfter"
                                                    onmousedown={handleFmtMouseDown}
                                                    onclick={handleCtxTable}
                                                >
                                                    <span class="dg-slash-item-label">+ Column right</span>
                                                </button>
                                                <button
                                                    class="dg-slash-item"
                                                    data-taction="mergeCells"
                                                    onmousedown={handleFmtMouseDown}
                                                    onclick={handleCtxTable}
                                                >
                                                    <span class="dg-slash-item-label">Merge cells</span>
                                                </button>
                                                <button
                                                    class="dg-slash-item"
                                                    data-taction="splitCell"
                                                    onmousedown={handleFmtMouseDown}
                                                    onclick={handleCtxTable}
                                                >
                                                    <span class="dg-slash-item-label">Split merged cell</span>
                                                </button>
                                                <button
                                                    class="dg-slash-item"
                                                    data-taction="rowDel"
                                                    onmousedown={handleFmtMouseDown}
                                                    onclick={handleCtxTable}
                                                >
                                                    <span class="dg-slash-item-label">&#8722; Delete row</span>
                                                </button>
                                                <button
                                                    class="dg-slash-item"
                                                    data-taction="colDel"
                                                    onmousedown={handleFmtMouseDown}
                                                    onclick={handleCtxTable}
                                                >
                                                    <span class="dg-slash-item-label">&#8722; Delete column</span>
                                                </button>
                                                <button
                                                    class="dg-slash-item"
                                                    data-taction="repeatHeader"
                                                    onmousedown={handleFmtMouseDown}
                                                    onclick={handleCtxTable}
                                                >
                                                    <span class="dg-slash-item-label">Repeat header each page</span>
                                                </button>
                                                <button
                                                    class="dg-slash-item dg-pill-menu-remove"
                                                    data-taction="tableDel"
                                                    onmousedown={handleFmtMouseDown}
                                                    onclick={handleCtxTable}
                                                >
                                                    <span class="dg-slash-item-label">Delete whole table</span>
                                                </button>
                                            </template>
                                            <button
                                                class="dg-slash-item dg-pill-menu-remove"
                                                onclick={handleCtxDeleteBlock}
                                            >
                                                <span class="dg-slash-item-label">Delete this block</span>
                                            </button>
                                        </template>
                                    </div>
                                </template>
                                <template if:true={isLoadingHtmlBody}>
                                    <div class="slds-is-relative" style="height: 40px">
                                        <lightning-spinner
                                            alternative-text="Loading HTML body"
                                            size="small"
                                        ></lightning-spinner>
                                    </div>
                                </template>
                                <div class={codeSplitClass}>
                                    <textarea
                                        class={designerEditorClass}
                                        spellcheck="false"
                                        aria-label="Template HTML body"
                                        oninput={handleHtmlBodyEditorInput}
                                        placeholder="Paste your template HTML here — from your AI assistant, Google Docs (File → Download → Web Page), or hand-written. Merge tags like &#123;Name&#125; fill from your Query Config."
                                    ></textarea>

                                <template lwc:if={showCanvasDesigner}>
                                    <c-doc-gen-canvas
                                        template-id={editTemplateId}
                                        page-size={editTemplatePageSize}
                                        orientation={editTemplatePageOrientation}
