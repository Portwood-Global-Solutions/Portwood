<template>
    <section class="sender">
        <header class="sender-heading">
            <lightning-icon icon-name="utility:signature" size="small"></lightning-icon>
            <div class="grow">
                <h2>Signatures</h2>
                <p>Prepare a document and collect signatures on this record.</p>
            </div>
            <lightning-button-icon
                icon-name="utility:refresh"
                alternative-text="Refresh requests"
                onclick={refreshRequests}
            ></lightning-button-icon>
        </header>
        <lightning-button
            class="new-request"
            variant="brand"
            label="New signature request"
            icon-name="utility:add"
            onclick={openComposer}
        ></lightning-button>
        <template if:true={error}><p class="error" role="alert">{error}</p></template>
        <template if:true={hasDrafts}>
            <h3>Continue preparing</h3>
            <template for:each={drafts} for:item="draft">
                <div class="request-row" key={draft.id}>
                    <span class="grow">{draft.title}</span><span class="badge">Draft</span>
                    <lightning-button label="Resume" data-draft={draft.id} onclick={openComposer}></lightning-button>
                </div>
            </template>
        </template>
        <h3>Recent requests</h3>
        <template if:false={hasRequests}><p class="empty">Sent requests will appear here.</p></template>
        <template for:each={requests} for:item="request">
            <div class="request-row" key={request.id}>
                <div class="grow"><strong>{request.documentTitle}</strong><small>{request.name}</small></div>
                <span class="badge">{request.status}</span>
                <lightning-button-group>
                    <lightning-button
                        label="View"
                        icon-name="utility:open"
                        data-id={request.id}
                        onclick={viewRequest}
                    ></lightning-button>
                    <template if:true={request.canManage}>
                        <lightning-button
                            label="Resend"
                            icon-name="utility:send"
                            data-id={request.id}
                            onclick={resendRequest}
                        ></lightning-button>
                        <lightning-button
                            label="Revoke"
                            variant="destructive-text"
                            data-id={request.id}
                            onclick={revokeRequest}
                        ></lightning-button>
                    </template>
                </lightning-button-group>
            </div>
        </template>
    </section>
    <template if:true={modalOpen}>
        <section
            role="dialog"
            aria-modal="true"
            aria-labelledby="preparation-title"
            tabindex="-1"
            onkeydown={handleComposerKeydown}
            class="slds-modal slds-fade-in-open preparation-modal"
        >
            <div class="slds-modal__container">
                <header class="slds-modal__header preparation-header">
                    <template if:true={showChangeSource}>
                        <lightning-button
                            label={sourceActionLabel}
                            icon-name="utility:back"
                            onclick={changeSource}
                        ></lightning-button>
                    </template>
                    <h2 id="preparation-title" class="slds-text-heading_medium grow">{modalTitle}</h2>
                    <lightning-button-icon
                        icon-name="utility:close"
                        alternative-text="Close signature request"
                        onclick={closeComposer}
                    ></lightning-button-icon>
                </header>
                <div class="slds-modal__content preparation-content">
                    <template if:true={showPdfLoading}
                        ><lightning-spinner
                            alternative-text="Opening document preparation"
                            size="small"
                        ></lightning-spinner
                    ></template>
                    <template if:true={visibleComposerError}
                        ><p class="composer-error" role="alert">{composerError}</p></template
                    >
                    <template if:true={showSourceChooser}>
                        <section class="source-picker" aria-label="Choose a document source">
                            <h3>What would you like to send?</h3>
                            <p>Choose a PDF or generate a document from a Portwood template.</p>
                            <div class="source-choices">
                                <button type="button" data-source="upload" onclick={chooseSource}>
                                    <lightning-icon icon-name="utility:upload" size="small"></lightning-icon>
                                    <span>Upload PDF</span><small>Bring your own document</small>
                                </button>
                                <button type="button" data-source="files" onclick={chooseSource}>
                                    <lightning-icon icon-name="utility:open_folder" size="small"></lightning-icon>
                                    <span>Salesforce file</span><small>Choose a PDF on this record</small>
                                </button>
                                <button type="button" data-source="templates" onclick={chooseSource}>
                                    <lightning-icon icon-name="utility:insert_template" size="small"></lightning-icon>
                                    <span>Portwood template</span><small>Generate from record data</small>
                                </button>
                            </div>
                            <template if:true={hasPreparation}
                                ><p class="source-hint">
                                    Your work stays available while you switch sources in this request.
                                </p></template
                            >
                        </section>
                    </template>
                    <template if:true={hasPdfEditor}>
                        <iframe
                            src={editorUrl}
                            title="Prepare a PDF for signature"
                            class="preparation-frame"
                            hidden={hidePdfEditor}
                            allow="clipboard-write"
                        ></iframe>
                    </template>
                    <template if:true={templateStarted}>
                        <div class="template-sender" hidden={hideTemplateEditor}>
                            <c-doc-gen-template-signature-sender
                                record-id={recordId}
                                onrequestcreated={handleTemplateRequestCreated}
                            ></c-doc-gen-template-signature-sender>
                        </div>
                    </template>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
